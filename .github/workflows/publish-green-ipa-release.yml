name: Publish Green Filza 27 IPA

on:
  push:
    branches: [ main ]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-green-filza-27
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for exact-SHA verified IPA build
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            RUN_JSON="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow verify-upstream-byetunes-ssh.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId,status,conclusion,headSha,number 2>/dev/null || true)"

            RUN_ID="$(jq -r '.[0].databaseId // empty' <<<"$RUN_JSON")"
            if [[ -z "$RUN_ID" ]]; then
              echo "Verified IPA run for $GITHUB_SHA has not appeared yet (attempt $attempt/90)."
              sleep 10
              continue
            fi

            RUN_STATUS="$(jq -r '.[0].status // empty' <<<"$RUN_JSON")"
            RUN_CONCLUSION="$(jq -r '.[0].conclusion // empty' <<<"$RUN_JSON")"
            RUN_SHA="$(jq -r '.[0].headSha // empty' <<<"$RUN_JSON")"
            RUN_NUMBER="$(jq -r '.[0].number // empty' <<<"$RUN_JSON")"

            test "$RUN_SHA" = "$GITHUB_SHA"

            if [[ "$RUN_STATUS" != "completed" ]]; then
              echo "Verified IPA run $RUN_ID is $RUN_STATUS (attempt $attempt/90)."
              sleep 10
              continue
            fi

            if [[ "$RUN_CONCLUSION" != "success" ]]; then
              echo "Refusing to publish: verified IPA run $RUN_ID concluded $RUN_CONCLUSION."
              exit 1
            fi

            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "Verified IPA run $RUN_ID is green for exact SHA $GITHUB_SHA."
            exit 0
          done

          echo "Timed out waiting for the verified IPA workflow for $GITHUB_SHA."
          exit 1

      - name: Download exact verified IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_RUN_ID: ${{ steps.verified.outputs.run_id }}
        shell: bash
        run: |
          set -euxo pipefail
          gh run download "$VERIFIED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name FilzaSlop-ByeTunes-All-YouTube-SSH-unsigned-arm64 \
            --dir verified-artifact

      - name: Verify release IPA
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_IPA="$(find verified-artifact -type f -name '*.ipa' -print -quit)"
          test -n "$SOURCE_IPA"
          test -s "$SOURCE_IPA"

          mkdir -p release
          cp "$SOURCE_IPA" "release/Filza 27.ipa"

          unzip -tq "release/Filza 27.ipa"
          unzip -l "release/Filza 27.ipa" | grep -Eq 'Payload/[^/]+\.app/'
          shasum -a 256 "release/Filza 27.ipa" | tee release/Filza-27-SHA256.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_RUN_ID: ${{ steps.verified.outputs.run_id }}
          VERIFIED_RUN_NUMBER: ${{ steps.verified.outputs.run_number }}
          VERIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="filza-27-${VERIFIED_RUN_NUMBER}"
          NOTES="Verified green Filza 27 IPA from workflow run ${VERIFIED_RUN_ID} at commit ${VERIFIED_SHA}."

          # Keep the release hidden until GitHub proves it preserved the literal-space IPA name.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "$VERIFIED_SHA" \
              --title "Filza 27" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              "release/Filza-27-SHA256.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$VERIFIED_SHA" \
              --title "Filza 27" \
              --notes "$NOTES" \
              --draft
          fi

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          test -n "$RELEASE_ID"

          # Remove any previous IPA asset on a retried run so only the exact-name file can survive.
          jq -r '.assets[] | select(.name == "Filza.27.ipa" or .name == "Filza 27.ipa") | .id' <<<"$RELEASE_JSON" | while read -r ASSET_ID; do
            [[ -z "$ASSET_ID" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          done

          # Upload with the exact filename encoded only for the URL. GitHub must return the literal name.
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"release/Filza 27.ipa" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Filza%2027.ipa&label=Filza%2027.ipa" \
            > release/asset.json

          test "$(jq -r '.state' release/asset.json)" = "uploaded"
          test "$(jq -r '.name' release/asset.json)" = "Filza 27.ipa"
          test "$(jq -r '.label' release/asset.json)" = "Filza 27.ipa"

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

          FINAL_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<<"$FINAL_JSON")" = "false"
          test "$(jq -r '.assets[] | select(.name == "Filza 27.ipa") | .name' <<<"$FINAL_JSON")" = "Filza 27.ipa"
          echo "Literal Release asset filename verified: Filza 27.ipa"
