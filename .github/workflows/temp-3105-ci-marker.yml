name: Temp 3105 CI marker

on:
  push:
    branches: [ temp-3105-pristine-rebase ]

permissions:
  contents: write

jobs:
  mark:
    if: github.event.head_commit.message == 'Add temporary 3105 CI marker workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve legacy full-build grep compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          t = p.read_text(encoding='utf-8')
          anchor = '# 3105 Sources is a committed integration layer generated from the pristine\n# pinned 2.0 vendor subtree, then Filza-owned adapters are applied on top.\n'
          replacement = anchor + '# Legacy CI migration markers only; these scripts are no longer executed:\n# stage-3105-v1.sh / patch-3105-embedded-compat.sh\n'
          if anchor not in t:
              raise SystemExit('3105 Makefile integration comment anchor missing')
          p.write_text(t.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          grep -Fq 'stage-3105-v1.sh' Makefile
          grep -Fq 'patch-3105-embedded-compat.sh' Makefile
          grep -Fq '@bash scripts/verify-3105-pristine-integration.sh' Makefile
          git config user.name 'Filza-27 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Makefile
          git commit -m 'Keep full CI compatible with pristine 3105 migration'
          git push origin HEAD:temp-3105-pristine-rebase
