name: Verify Filza installable IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-installable-filza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-arm64-ipa:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BYETUNES_COMMIT: 1a90f9e0f2b1a1787b208809ad2373f5c52175c8
      BAD_QUERY_COMMIT: 73ef6da1adabef0982fd00e36cb85f21b8f8194a
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned source dependencies
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"
          test "$(git -C ByeTunes rev-parse HEAD)" = "$BYETUNES_COMMIT"
          test "$(git -C ThirdParty/bad_query rev-parse HEAD)" = "$BAD_QUERY_COMMIT"
          test -f ByeTunes/MusicManager/ContentView.swift
          test -f ByeTunes/MusicManager/YouTubeKit/Resources/meriyah.umd.js
          test -f ThirdParty/bad_query/bad_query/bad_query.c
          test -f GestaltManager.m
          test -f FilzaMondBridge.m
          test -f FilzaMainToolbarGestalt.m
          test -f MondGestaltView.swift
          test -f Filza3105Host.swift
          test -f Filza3105Bridge.m
          test -f Filza3105AppLauncher.m
          test -f ThirdParty/3105/Sources/AppDataBrowserView.swift
          test -f ThirdParty/3105/Sources/PatchProjectsView.swift
          test -f ThirdParty/3105/Sources/ThreeOneOSFiveContentView.swift
          test -f ThirdParty/3105/Sources/AppState.swift
          test -f ThirdParty/3105/Sources/CleanerView.swift
          test -f ThirdParty/3105/Sources/WallpaperLabView.swift
          test -f ThirdParty/3105/Sources/ThreeOneOSFiveSettingsView.swift
          test -f ThirdParty/3105/Sources/LogView.swift
          test -f ThirdParty/3105/Sources/LimitedCleanerService.swift
          test -f ThirdParty/3105/Sources/CleanerCatalog.swift
          test -f ThirdParty/3105/Sources/MG.swift
          test -f ThirdParty/3105/Sources/SBX.swift
          test -f ThirdParty/3105/Sources/SecureZIPArchive.swift
          test -f ThirdParty/3105/Sources/SupportPolicy.swift
          test -f ThirdParty/3105/Sources/WallpaperInstaller.swift
          test -f ThirdParty/3105/Sources/WallpaperLabModels.swift
          test -f ThirdParty/3105/Sources/WallpaperLabService.swift
          test -f ThirdParty/3105/Sources/wallpaper_zip.c
          test -f ThirdParty/3105/Sources/PatchPackageCodec.swift
          test -f ThirdParty/3105/Sources/PatchTransaction.swift
          test -f ThirdParty/3105/Resources/Filza3105.bundle/Info.plist
          test -f ThirdParty/3105/Resources/Filza3105.bundle/AppIcon3105.png
          test -f ThirdParty/3105/LICENSE
          grep -Fq '1da66f733a7ad6bb5c9e1d078e89cfbb02faec72' ThirdParty/3105/UPSTREAM.md
          python3 - <<'PY'
          from pathlib import Path

          root = Path("ThirdParty/3105/Sources/ThreeOneOSFiveContentView.swift").read_text()
          for required in (
              "DashboardView()",
              "AppDataBrowserView()",
              "PatchProjectsView()",
              "CleanerView()",
              "WallpaperLabView()",
              "ThreeOneOSFiveSettingsView()",
              "LogView()",
              "selectedTab = 2",
          ):
              assert required in root, required

          host = Path("Filza3105Host.swift").read_text()
          assert "ThreeOneOSFiveContentView(initialTab: initialTab)" in host
          assert "initialTab: 1" in host
          assert "initialTab: 2" in host
          assert "AppDataBrowserView()" not in host
          assert "PatchProjectsView()" not in host

          browser = Path("ThirdParty/3105/Sources/FileBrowserView.swift").read_text()
          for required in (
              ".contextMenu",
              "requestPatchCreation(for:",
              "preparePatchDraft(",
              "patchDraftCoordinator.present(draft)",
          ):
              assert required in browser, required

          patches = Path("ThirdParty/3105/Sources/PatchProjectsView.swift").read_text()
          assert ".sheet(item: $draftCoordinator.request)" in patches
          assert "initialDraft: request.draft" in patches
          print("Verified the complete connected 3105 root instead of standalone partial hosts")
          PY
          test -f ByeTunesFilzaLibraryEmbed.m
          test -f ByeTunesFullAppLauncher.m
          test -f ByeTunesFullAppLauncher.h
          test -f FilzaDiagnostics.m
          test -f FilzaQuickActions.m
          test -f WebDAVRuntimeFix.m
          test -f ThirdParty/GCDWebServer/GCDWebDAVServer/GCDWebDAVServer.m
          test -f ThirdParty/GCDWebServer/GCDWebServer/Core/GCDWebServer.m
          test -f ThirdParty/GCDWebServer/LICENSE
          python3 - <<'PY'
          from pathlib import Path
          source = Path("MondGestaltView.swift").read_text()
          mappings = {
              "7brdL5xrEUWnlF9C0kdg5A": "DeviceSupportsHighLuminanceAlwaysOnDisplay",
              "A/74xUbqJwBsaWTjSDd0fQ": "ChassisSlotFunctionNumber",
              "a3n5T9sFtlyQ74NEp9ESxg": "SiriMode",
              "HBG+hj/Oz89PjVgn93Jd8A": "Image4SecureBootKeyScheme",
              "ikn/KMyeztXJhAj/dqBjBg": "LowPowerRendererCapability",
              "J2+oJRiGdbAzTi6U5nhqdQ": "PostQuantumCryptographyEnforced",
              "Kpfa0nb8nn8EVzI/UgcMfQ": "CoalescedSubTargetID",
              "lyJZrSDc8J8eQ5b7A1Rvw": "DeviceSupportsTouchSensitiveCameraControl",
              "m4xs4mhvxnAopYrApoLDMw": "DeviceSupportsInstructionFollowingPruningModels",
              "mnPU37/y4i0TJFnJc+r4lA": "DeviceSupportsLowPowerWake",
              "odI0U9Etrx7hObzvJ9xJ8Q": "DeviceSupportsSandcat",
              "P4ZJVy/zYuLy4ejRKP+0DA": "DeviceSupportsRegionalCameraShutterRelaxation",
              "qqrspu7CpuPdZwSDxNY+Fg": "MaximumFlipbookCount",
              "s1ZXqZtUSpr+BjUgZXZ/2g": "ChassisSlotInstanceNumber",
              "TusANsf9Lfe3P/9fIXXSrQ": "DeviceSupportsAlwaysListeningHeySiri",
              "VXc3L66nqQ6bn4z60ChX+A": "ResponsiveAirPlayAudioCapability",
              "ym8C/Ut5YcBnqAdm4NEDLQ": "Image4SecureBootCertificateFormat",
          }
          assert len(mappings) == 17
          for key, name in mappings.items():
              assert f'key: "{key}", name: "{name}"' in source, (key, name)
          print("Verified all 17 exact iOS 27 Gestalt key mappings")
          PY

      - name: Syntax-check runtime integrations
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON=(
            -isysroot "$SDK"
            -target arm64-apple-ios16.0
            -fmodules
            -fobjc-arc
            -fblocks
            -fsyntax-only
            -include errno.h
            -I.
            -IThirdParty/bad_query/bad_query
            -IThirdParty/GCDWebServer/GCDWebServer/Core
            -IThirdParty/GCDWebServer/GCDWebServer/Requests
            -IThirdParty/GCDWebServer/GCDWebServer/Responses
            -IThirdParty/GCDWebServer/GCDWebDAVServer
            -I"$SDK/usr/include/libxml2"
            -Wno-deprecated-declarations
            -Wno-arc-performSelector-leaks
          )
          xcrun --sdk iphoneos clang "${COMMON[@]}" GestaltManager.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaMondBridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaMainToolbarGestalt.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" Filza3105Bridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" Filza3105AppLauncher.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ThirdParty/3105/Sources/AppIconHelper.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppsMusicFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppsManagerPresentationFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesMusicBridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesFilzaLibraryEmbed.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesFullAppLauncher.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaDiagnostics.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaQuickActions.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" WebDAVRuntimeFix.m
          while IFS= read -r source; do
            xcrun --sdk iphoneos clang "${COMMON[@]}" "$source"
          done < <(find ThirdParty/GCDWebServer/GCDWebServer ThirdParty/GCDWebServer/GCDWebDAVServer -type f -name '*.m' -print | sort)
          xcrun --sdk iphoneos clang "${COMMON[@]}" ThirdParty/bad_query/bad_query/bad_query.c

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Verify pinned Theos
        run: |
          set -euxo pipefail
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_COMMIT"
          test -f "$THEOS/makefiles/common.mk"

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI for iOS arm64
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Verify pinned idevice FFI for iOS arm64
        run: |
          set -euxo pipefail
          test "$(cat Vendor/idevice/COMMIT)" = "$IDEVICE_COMMIT"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/idevice/include/idevice.h

      - name: Build and link complete arm64 target
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:16.0
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          grep -aFq 'Gestalt Editor' "$DYLIB"
          grep -aFq 'MondGestaltHostFactory' "$DYLIB"
          grep -aFq 'TGMainView persistent Gestalt/Patches toolbar hooks installed' "$DYLIB"
          grep -aFq 'ensured persistent Apps/Music/Gestalt/Patches bottom toolbar' "$DYLIB"
          grep -aFq 'Filza3105HostFactory' "$DYLIB"
          grep -aFq 'constructing complete 3105 Apps Manager' "$DYLIB"
          grep -aFq 'constructing complete 3105 Patches' "$DYLIB"
          grep -aFq 'constructing full upstream 3105 workspace' "$DYLIB"
          grep -aFq 'full upstream workspace appeared initialTab=' "$DYLIB"
          grep -aFq 'tab.home' "$DYLIB"
          grep -aFq 'tab.files' "$DYLIB"
          grep -aFq 'tab.patches' "$DYLIB"
          grep -aFq 'tab.cleaner' "$DYLIB"
          grep -aFq 'tab.wallpapers' "$DYLIB"
          grep -aFq 'cleaner.scan_again' "$DYLIB"
          grep -aFq 'wallpaper.checking' "$DYLIB"
          grep -aFq 'settings.verified_versions' "$DYLIB"
          grep -aFq 'logs.empty_title' "$DYLIB"
          grep -aFq 'TGMainView complete 3105 Apps route installed' "$DYLIB"
          grep -aFq 'presented complete %@ directly' "$DYLIB"
          grep -aFq '3105 Apps Manager' "$DYLIB"
          grep -aFq '3105 Patches' "$DYLIB"
          grep -aFq '3105PATCH' "$DYLIB"
          grep -aFq 'presented complete Gestalt Editor directly' "$DYLIB"
          grep -aFq 'Device Spoofing Info' "$DYLIB"
          grep -aFq 'iPadOS UI Warning' "$DYLIB"
          grep -aFq 'Disable Dynamic Island' "$DYLIB"
          grep -aFq 'iOS 27 Gestalt Keys' "$DYLIB"
          grep -aFq 'DeviceSupportsHighLuminanceAlwaysOnDisplay' "$DYLIB"
          grep -aFq 'DeviceSupportsSandcat' "$DYLIB"
          grep -aFq 'Image4SecureBootCertificateFormat' "$DYLIB"
          grep -aFq 'presenting complete Mond Settings' "$DYLIB"
          grep -aFq 'Run Exploit' "$DYLIB"
          grep -aFq 'Generate Token' "$DYLIB"
          grep -aFq 'Keep Alive' "$DYLIB"
          grep -aFq 'Mond Respring confirmed' "$DYLIB"
          grep -aFq 'bad_query' "$DYLIB"
          grep -aFq 'cmg' "$DYLIB"
          ! grep -aFq 'Loading MobileGestalt' "$DYLIB"
          ! grep -aFq 'Opening the complete Gestalt Editor' "$DYLIB"
          grep -aFq 'legacy manager-row insertion disabled; persistent bottom toolbar owns Gestalt' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.gestalt-manager' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.apps-manager' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.music-library' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.patches' "$DYLIB"
          grep -aFq 'FilzaSlop Logs' "$DYLIB"
          grep -aFq 'LastSignal.txt' "$DYLIB"
          grep -aFq 'TGMusicLibraryViewController viewDidAppear intercepted' "$DYLIB"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'TGMainView direct full ByeTunes route installed' "$DYLIB"
          grep -aFq 'opened complete ByeTunes directly' "$DYLIB"
          grep -aFq 'complete ByeTunes host attached directly to Music Library' "$DYLIB"
          grep -aFq 'before direct Music Library ContentView construction' "$DYLIB"
          grep -aFq 'direct Music Library SwiftUI host ready' "$DYLIB"
          grep -aFq 'persistent pairing state restored=' "$DYLIB"
          grep -aFq 'imported pairing file persisted at' "$DYLIB"
          grep -aFq 'restored persisted pairing file; reconnecting automatically' "$DYLIB"
          grep -aFq 'no persisted pairing file; showing import flow' "$DYLIB"
          grep -aFq 'Current Apple Music JWT token selected' "$DYLIB"
          ! grep -aFq 'Starting ByeTunes' "$DYLIB"
          ! grep -aFq 'before ByeTunes can connect' "$DYLIB"
          ! grep -aFq 'Add ByeTunes Shortcut' "$DYLIB"
          ! grep -aFq 'ByeTunes could not be created' "$DYLIB"
          grep -aFq 'jailed in-process WebDAV lifecycle hook installed' "$DYLIB"
          grep -aFq 'WebDAV toggle hooks installed' "$DYLIB"
          grep -aFq 'WebDAV checkbox action completed' "$DYLIB"
          grep -aFq 'server did not report listening; rebuilding the in-process server once' "$DYLIB"
          grep -aFq 'GCDWebDAVServer' "$DYLIB"
          grep -aFq 'PROPFIND' "$DYLIB"
          grep -aFq 'UNLOCK' "$DYLIB"
          ! grep -aFq 'inert UIKit launcher visible' "$DYLIB"
          shasum -a 256 "$DYLIB"

      - name: Generate ByeTunes AppIntents metadata
        continue-on-error: true
        run: |
          set -euxo pipefail
          bash scripts/generate-appintents-metadata.sh .theos/byetunes-appintents

      - name: Stage complete ByeTunes runtime resources
        run: |
          set -euxo pipefail
          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources
          test -s .theos/byetunes-resources/meriyah.umd.js
          test -s .theos/byetunes-resources/astring.umd.js
          test -s .theos/byetunes-resources/yt_ejs_helper.js
          test -s .theos/byetunes-resources/AppIconImage.png
          plutil -lint .theos/byetunes-resources/ByeTunes-Info.plist

      - name: Download and verify unsigned Filza base IPA
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 "$BASE_IPA_URL" -o .theos/FilzaSlop-base-unsigned.ipa
          echo "$BASE_IPA_SHA256  .theos/FilzaSlop-base-unsigned.ipa" | shasum -a 256 -c -

      - name: Package current target into a real unsigned IPA
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d /tmp/filzaslop-ipa.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          unzip -q .theos/FilzaSlop-base-unsigned.ipa -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          test -s "$APP/$EXECUTABLE"
          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          codesign --remove-signature "$APP/Frameworks/FilzaApplySandboxExt.dylib" >/dev/null 2>&1 || true

          cp .theos/byetunes-resources/meriyah.umd.js "$APP/meriyah.umd.js"
          cp .theos/byetunes-resources/astring.umd.js "$APP/astring.umd.js"
          cp .theos/byetunes-resources/yt_ejs_helper.js "$APP/yt_ejs_helper.js"
          cp .theos/byetunes-resources/AppIconImage.png "$APP/AppIconImage.png"
          cp .theos/byetunes-resources/ByeTunes-Info.plist "$APP/ByeTunes-Info.plist"
          rm -rf "$APP/Filza3105.bundle"
          cp -R ThirdParty/3105/Resources/Filza3105.bundle "$APP/Filza3105.bundle"
          if test -d .theos/byetunes-appintents/Metadata.appintents; then
            rm -rf "$APP/Metadata.appintents"
            cp -R .theos/byetunes-appintents/Metadata.appintents "$APP/Metadata.appintents"
          fi

          plutil -replace UIApplicationShortcutItems -json '[{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.apps-manager","UIApplicationShortcutItemTitle":"Apps Manager","UIApplicationShortcutItemSubtitle":"Browse app data with 3105","UIApplicationShortcutItemIconSymbolName":"square.grid.2x2"},{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.music-library","UIApplicationShortcutItemTitle":"Music Library","UIApplicationShortcutItemSubtitle":"Open Music Library","UIApplicationShortcutItemIconSymbolName":"music.note.list"},{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.gestalt-manager","UIApplicationShortcutItemTitle":"Gestalt Editor","UIApplicationShortcutItemSubtitle":"Edit MobileGestalt","UIApplicationShortcutItemIconSymbolName":"slider.horizontal.3"},{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.patches","UIApplicationShortcutItemTitle":"Patches","UIApplicationShortcutItemSubtitle":"Manage portable .3105 patches","UIApplicationShortcutItemIconSymbolName":"shippingbox"}]' "$APP/Info.plist"
          plutil -replace CFBundleShortVersionString -string "4.8" "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "$APP/Info.plist"
          plutil -replace UIFileSharingEnabled -bool YES "$APP/Info.plist"
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool YES "$APP/Info.plist"
          plutil -replace NSLocalNetworkUsageDescription -string "FilzaSlop uses your local network when you enable its WebDAV server." "$APP/Info.plist"
          plutil -replace NSBonjourServices -json '["_http._tcp"]' "$APP/Info.plist"

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          actions = info.get('UIApplicationShortcutItems', [])
          assert len(actions) == 4, actions
          assert [a['UIApplicationShortcutItemTitle'] for a in actions] == ['Apps Manager', 'Music Library', 'Gestalt Editor', 'Patches'], actions
          assert [a['UIApplicationShortcutItemType'] for a in actions] == [
              'com.nightvibes33.filzaslop.apps-manager',
              'com.nightvibes33.filzaslop.music-library',
              'com.nightvibes33.filzaslop.gestalt-manager',
              'com.nightvibes33.filzaslop.patches',
          ], actions
          assert info.get('UIFileSharingEnabled') is True
          assert info.get('LSSupportsOpeningDocumentsInPlace') is True
          assert info.get('NSLocalNetworkUsageDescription')
          assert info.get('NSBonjourServices') == ['_http._tcp']
          assert info.get('CFBundleShortVersionString') == '4.8'
          assert str(info.get('CFBundleVersion', '')).isdigit()
          print('Verified exactly four quick actions and Files/Documents exposure flags')
          PY

          otool -L "$APP/$EXECUTABLE" | grep -F 'FilzaApplySandboxExt.dylib'
          test -s "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          test -s "$APP/meriyah.umd.js"
          test -s "$APP/astring.umd.js"
          test -s "$APP/yt_ejs_helper.js"
          test -s "$APP/AppIconImage.png"
          test -s "$APP/Filza3105.bundle/Info.plist"
          test -s "$APP/Filza3105.bundle/AppIcon3105.png"
          test -s "$APP/Filza3105.bundle/en.lproj/Localizable.strings"
          test -x "$APP/helpers/FilzaWebDAVServer"
          test -s "$APP/com.tigisoftware.filza.webdavserver.plist"

          OUTPUT="$GITHUB_WORKSPACE/.theos/FilzaSlop-main-${GITHUB_SHA::7}-unsigned.ipa"
          rm -f "$OUTPUT"
          (cd "$STAGE" && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          unzip -l "$OUTPUT" | grep -F 'meriyah.umd.js'
          unzip -l "$OUTPUT" | grep -F 'AppIconImage.png'
          unzip -l "$OUTPUT" | grep -F 'Filza3105.bundle/en.lproj/Localizable.strings'
          unzip -l "$OUTPUT" | grep -F 'Filza3105.bundle/AppIcon3105.png'
          shasum -a 256 "$OUTPUT" | tee .theos/IPA-SHA256.txt

      - name: Upload installable unsigned IPA and verification files
        uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-installable-unsigned-arm64
          path: |
            .theos/FilzaSlop-main-*-unsigned.ipa
            .theos/IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
            .theos/byetunes-resources/**
            .theos/byetunes-appintents/Metadata.appintents/**
            ThirdParty/3105/UPSTREAM.md
            ThirdParty/3105/LICENSE
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
