name: Verify Filza installable IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-installable-filza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-arm64-ipa:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BYETUNES_COMMIT: 1a90f9e0f2b1a1787b208809ad2373f5c52175c8
      BAD_QUERY_COMMIT: 73ef6da1adabef0982fd00e36cb85f21b8f8194a
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned source dependencies
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"
          test "$(git -C ByeTunes rev-parse HEAD)" = "$BYETUNES_COMMIT"
          test "$(git -C ThirdParty/bad_query rev-parse HEAD)" = "$BAD_QUERY_COMMIT"
          test -f ByeTunes/MusicManager/ContentView.swift
          test -f ByeTunes/MusicManager/YouTubeKit/Resources/meriyah.umd.js
          test -f ThirdParty/bad_query/bad_query/bad_query.c
          test -f GestaltManager.m
          test -f ByeTunesFilzaLibraryEmbed.m
          test -f FilzaDiagnostics.m
          test -f FilzaQuickActions.m

      - name: Syntax-check runtime integrations
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON=(
            -isysroot "$SDK"
            -target arm64-apple-ios16.0
            -fmodules
            -fobjc-arc
            -fblocks
            -fsyntax-only
            -include errno.h
            -I.
            -IThirdParty/bad_query/bad_query
            -Wno-deprecated-declarations
            -Wno-arc-performSelector-leaks
          )
          xcrun --sdk iphoneos clang "${COMMON[@]}" GestaltManager.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppsMusicFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppsManagerPresentationFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesMusicBridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesFilzaLibraryEmbed.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaDiagnostics.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaQuickActions.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ThirdParty/bad_query/bad_query/bad_query.c

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Verify pinned Theos
        run: |
          set -euxo pipefail
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_COMMIT"
          test -f "$THEOS/makefiles/common.mk"

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI for iOS arm64
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Verify pinned idevice FFI for iOS arm64
        run: |
          set -euxo pipefail
          test "$(cat Vendor/idevice/COMMIT)" = "$IDEVICE_COMMIT"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/idevice/include/idevice.h

      - name: Build and link complete arm64 target
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:16.0
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          grep -aFq 'Gestalt Manager' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.gestalt-manager' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.apps-manager' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.music-library' "$DYLIB"
          grep -aFq 'FilzaSlop Logs' "$DYLIB"
          grep -aFq 'LastSignal.txt' "$DYLIB"
          grep -aFq 'TGMusicLibraryViewController viewDidAppear intercepted' "$DYLIB"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          shasum -a 256 "$DYLIB"

      - name: Generate ByeTunes AppIntents metadata
        continue-on-error: true
        run: |
          set -euxo pipefail
          bash scripts/generate-appintents-metadata.sh .theos/byetunes-appintents

      - name: Stage complete ByeTunes runtime resources
        run: |
          set -euxo pipefail
          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources
          test -s .theos/byetunes-resources/meriyah.umd.js
          test -s .theos/byetunes-resources/astring.umd.js
          test -s .theos/byetunes-resources/yt_ejs_helper.js
          test -s .theos/byetunes-resources/AppIconImage.png
          plutil -lint .theos/byetunes-resources/ByeTunes-Info.plist

      - name: Download and verify unsigned Filza base IPA
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 "$BASE_IPA_URL" -o .theos/FilzaSlop-base-unsigned.ipa
          echo "$BASE_IPA_SHA256  .theos/FilzaSlop-base-unsigned.ipa" | shasum -a 256 -c -

      - name: Package current target into a real unsigned IPA
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d /tmp/filzaslop-ipa.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          unzip -q .theos/FilzaSlop-base-unsigned.ipa -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          test -s "$APP/$EXECUTABLE"
          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          codesign --remove-signature "$APP/Frameworks/FilzaApplySandboxExt.dylib" >/dev/null 2>&1 || true

          cp .theos/byetunes-resources/meriyah.umd.js "$APP/meriyah.umd.js"
          cp .theos/byetunes-resources/astring.umd.js "$APP/astring.umd.js"
          cp .theos/byetunes-resources/yt_ejs_helper.js "$APP/yt_ejs_helper.js"
          cp .theos/byetunes-resources/AppIconImage.png "$APP/AppIconImage.png"
          cp .theos/byetunes-resources/ByeTunes-Info.plist "$APP/ByeTunes-Info.plist"
          if test -d .theos/byetunes-appintents/Metadata.appintents; then
            rm -rf "$APP/Metadata.appintents"
            cp -R .theos/byetunes-appintents/Metadata.appintents "$APP/Metadata.appintents"
          fi

          # Apps and Music are static. GestaltManager owns its one dynamic
          # shortcut, so packaging a second static Gestalt item would duplicate it.
          plutil -replace UIApplicationShortcutItems -json '[{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.apps-manager","UIApplicationShortcutItemTitle":"Apps Manager","UIApplicationShortcutItemSubtitle":"Browse installed apps","UIApplicationShortcutItemIconSymbolName":"square.grid.2x2"},{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.music-library","UIApplicationShortcutItemTitle":"Music Library","UIApplicationShortcutItemSubtitle":"Open ByeTunes","UIApplicationShortcutItemIconSymbolName":"music.note.list"}]' "$APP/Info.plist"
          plutil -replace UIFileSharingEnabled -bool YES "$APP/Info.plist"
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool YES "$APP/Info.plist"

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          actions = info.get('UIApplicationShortcutItems', [])
          assert len(actions) == 2, actions
          assert [a['UIApplicationShortcutItemTitle'] for a in actions] == ['Apps Manager', 'Music Library'], actions
          assert [a['UIApplicationShortcutItemType'] for a in actions] == [
              'com.nightvibes33.filzaslop.apps-manager',
              'com.nightvibes33.filzaslop.music-library',
          ], actions
          assert info.get('UIFileSharingEnabled') is True
          assert info.get('LSSupportsOpeningDocumentsInPlace') is True
          print('Verified two static Apps/Music actions; Gestalt remains runtime-owned by GestaltManager')
          PY

          otool -L "$APP/$EXECUTABLE" | grep -F 'FilzaApplySandboxExt.dylib'
          test -s "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          test -s "$APP/meriyah.umd.js"
          test -s "$APP/astring.umd.js"
          test -s "$APP/yt_ejs_helper.js"
          test -s "$APP/AppIconImage.png"

          OUTPUT="$GITHUB_WORKSPACE/.theos/FilzaSlop-main-${GITHUB_SHA::7}-unsigned.ipa"
          rm -f "$OUTPUT"
          (cd "$STAGE" && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          unzip -l "$OUTPUT" | grep -F 'meriyah.umd.js'
          unzip -l "$OUTPUT" | grep -F 'AppIconImage.png'
          shasum -a 256 "$OUTPUT" | tee .theos/IPA-SHA256.txt

      - name: Upload installable unsigned IPA and verification files
        uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-installable-unsigned-arm64
          path: |
            .theos/FilzaSlop-main-*-unsigned.ipa
            .theos/IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
            .theos/byetunes-resources/**
            .theos/byetunes-appintents/Metadata.appintents/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
