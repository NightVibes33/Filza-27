name: Verify Filza installable IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-installable-filza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-arm64-ipa:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      BAD_QUERY_COMMIT: 73ef6da1adabef0982fd00e36cb85f21b8f8194a
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa
      BYETUNES_RELEASE_IPA_URL: https://github.com/EduAlexxis/ByeTunes/releases/download/v2.4/ByeTunes.ipa
      BYETUNES_RELEASE_IPA_SHA256: bd84ce18fbd80a4c738abff8e533c849ebb51d1cfe3248640c033e499681fca6

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned source dependencies
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"
          test "$(git -C ByeTunes rev-parse HEAD)" = "$BYETUNES_COMMIT"
          test "$(git -C ThirdParty/bad_query rev-parse HEAD)" = "$BAD_QUERY_COMMIT"
          test -f ByeTunes/MusicManager/ContentView.swift
          test -f ByeTunes/MusicManager/MusicView.swift
          test -f ByeTunes/MusicManager/DeviceLibraryBrowserView.swift
          test -f ByeTunes/MusicManager/BackgroundAudioDownloadManager.swift
          test -f ByeTunes/MusicManager/BackgroundMetadataFetchManager.swift
          test -f ByeTunes/MusicManagerActivityShared/DownloadLiveActivityAttributes.swift
          test -f ByeTunesMetadataCompat.swift
          test -f scripts/patch-byetunes-upstream-parity-v2.sh
          test -f scripts/restore-byetunes-v24-metadata-compat.sh
          test -f scripts/patch-byetunes-metadata-parity-post.sh
          test -f scripts/patch-byetunes-device-library-save.sh
          test -f scripts/stage-byetunes-resources.sh
          test -f ThirdParty/bad_query/bad_query/bad_query.c
          test -f ThirdParty/3105/Sources/ThreeOneOSFiveContentView.swift
          test -f ThirdParty/GCDWebServer/GCDWebDAVServer/GCDWebDAVServer.m
          grep -Fq 'patch-byetunes-upstream-parity-v2.sh' Makefile
          grep -Fq 'patch-byetunes-metadata-parity-post.sh' Makefile
          grep -Fq 'patch-byetunes-device-library-save.sh' Makefile
          ! grep -Fq 'patch-byetunes-upstream-parity.sh' Makefile
          ! grep -Fq 'patch-byetunes-embedded.sh' Makefile
          ! grep -Fq 'fix-byetunes-import-source-routing.sh' Makefile
          ! grep -Fq 'patch-byetunes-device-library-save.sh' scripts/patch-access-map-provenance.sh
          ! grep -Fq 'fix-byetunes-import-source-routing.sh' scripts/patch-access-map-provenance.sh

      - name: Syntax-check runtime integrations
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON=(
            -isysroot "$SDK"
            -target arm64-apple-ios16.0
            -fmodules
            -fobjc-arc
            -fblocks
            -fsyntax-only
            -include errno.h
            -I.
            -IThirdParty/bad_query/bad_query
            -IThirdParty/GCDWebServer/GCDWebServer/Core
            -IThirdParty/GCDWebServer/GCDWebServer/Requests
            -IThirdParty/GCDWebServer/GCDWebServer/Responses
            -IThirdParty/GCDWebServer/GCDWebDAVServer
            -I"$SDK/usr/include/libxml2"
            -Wno-deprecated-declarations
            -Wno-arc-performSelector-leaks
          )
          xcrun --sdk iphoneos clang "${COMMON[@]}" GestaltManager.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaMondBridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaMainToolbarGestalt.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" Filza3105Bridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesMusicBridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesFilzaLibraryEmbed.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesFullAppLauncher.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaDiagnostics.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaQuickActions.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" WebDAVRuntimeFix.m
          while IFS= read -r source; do
            xcrun --sdk iphoneos clang "${COMMON[@]}" "$source"
          done < <(find ThirdParty/GCDWebServer/GCDWebServer ThirdParty/GCDWebServer/GCDWebDAVServer -type f -name '*.m' -print | sort)
          xcrun --sdk iphoneos clang "${COMMON[@]}" ThirdParty/bad_query/bad_query/bad_query.c

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Verify pinned Theos
        run: |
          set -euxo pipefail
          test "$(git -C "$THEOS" rev-parse HEAD)" = "$THEOS_COMMIT"
          test -f "$THEOS/makefiles/common.mk"

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI for iOS arm64
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Verify pinned idevice FFI for iOS arm64
        run: |
          set -euxo pipefail
          test "$(cat Vendor/idevice/COMMIT)" = "$IDEVICE_COMMIT"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/idevice/include/idevice.h

      - name: Build and link complete arm64 target
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:16.0
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"

          grep -aFq 'Gestalt Editor' "$DYLIB"
          grep -aFq 'MondGestaltHostFactory' "$DYLIB"
          grep -aFq 'Filza3105HostFactory' "$DYLIB"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'TGMainView direct full ByeTunes route installed' "$DYLIB"
          grep -aFq 'ByeTunes 2.4 background URL session route installed on Filza AppDelegate' "$DYLIB"
          grep -aFq 'jailed in-process WebDAV lifecycle hook installed' "$DYLIB"

          grep -aFq 'upstream lifecycle onAppear entered' "$DYLIB"
          grep -aFq 'Installing auto-reconnect watcher' "$DYLIB"
          grep -aFq '[MusicView] metadata sources=' "$DYLIB"
          grep -aFq '[DeviceLibrarySave] VERIFIED persisted metadata' "$DYLIB"
          grep -aFq '[SyncNotify] Posted' "$DYLIB"
          grep -aFq 'Public search page fallback' "$DYLIB"
          grep -aFq 'Updates are delivered with FilzaSlop' "$DYLIB"

          ! grep -aFq 'Terminal success: progress reached 100 only after validated file persistence' "$DYLIB"
          ! grep -aFq 'Terminal failure: cleared active progress' "$DYLIB"
          ! grep -aFq 'Filza embed metadata compatibility sources=' "$DYLIB"
          ! grep -aFq 'The visible Import Metadata Source picker is the single source of truth.' "$DYLIB"

          shasum -a 256 "$DYLIB"

      - name: Generate ByeTunes AppIntents metadata
        run: |
          set -euxo pipefail
          bash scripts/generate-appintents-metadata.sh .theos/byetunes-appintents

      - name: Stage complete ByeTunes runtime resources
        run: |
          set -euxo pipefail
          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources
          test -s .theos/byetunes-resources/AppIconImage.png
          plutil -lint .theos/byetunes-resources/ByeTunes-Info.plist
          test -s .theos/byetunes-resources/Config.plist
          plutil -lint .theos/byetunes-resources/Config.plist

      - name: Download and verify unsigned Filza base IPA
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 "$BASE_IPA_URL" -o .theos/FilzaSlop-base-unsigned.ipa
          echo "$BASE_IPA_SHA256  .theos/FilzaSlop-base-unsigned.ipa" | shasum -a 256 -c -

      - name: Package current target into a real unsigned IPA
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d /tmp/filzaslop-ipa.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          unzip -q .theos/FilzaSlop-base-unsigned.ipa -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          test -s "$APP/$EXECUTABLE"

          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          codesign --remove-signature "$APP/Frameworks/FilzaApplySandboxExt.dylib" >/dev/null 2>&1 || true
          cp .theos/byetunes-resources/AppIconImage.png "$APP/AppIconImage.png"
          cp .theos/byetunes-resources/ByeTunes-Info.plist "$APP/ByeTunes-Info.plist"
          cp .theos/byetunes-resources/Config.plist "$APP/Config.plist"
          plutil -lint "$APP/Config.plist"
          python3 - "$APP/Config.plist" <<'PY'
          import ipaddress
          import plistlib
          import sys
          from urllib.parse import urlparse

          with open(sys.argv[1], 'rb') as f:
              config = plistlib.load(f)
          raw = config.get('ByeTunesApiUrl')
          parsed = urlparse(raw if isinstance(raw, str) else '')
          if parsed.scheme != 'https' or not parsed.hostname:
              raise SystemExit('embedded ByeTunes API configuration is invalid')
          host = parsed.hostname.lower()
          if host == 'localhost':
              raise SystemExit('embedded ByeTunes API configuration is loopback')
          try:
              if ipaddress.ip_address(host).is_loopback:
                  raise SystemExit('embedded ByeTunes API configuration is loopback')
          except ValueError:
              pass
          print('Verified embedded ByeTunes API configuration is present and non-loopback')
          PY
          rm -rf "$APP/Filza3105.bundle"
          cp -R ThirdParty/3105/Resources/Filza3105.bundle "$APP/Filza3105.bundle"
          if test -d .theos/byetunes-appintents/Metadata.appintents; then
            rm -rf "$APP/Metadata.appintents"
            cp -R .theos/byetunes-appintents/Metadata.appintents "$APP/Metadata.appintents"
          fi

          plutil -replace UIApplicationShortcutItems -json '[{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.apps-manager","UIApplicationShortcutItemTitle":"Apps Manager","UIApplicationShortcutItemIconSymbolName":"square.grid.2x2"},{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.music-library","UIApplicationShortcutItemTitle":"Music Library","UIApplicationShortcutItemIconSymbolName":"music.note.list"},{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.gestalt-manager","UIApplicationShortcutItemTitle":"Gestalt Editor","UIApplicationShortcutItemIconSymbolName":"slider.horizontal.3"},{"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.patches","UIApplicationShortcutItemTitle":"Patches","UIApplicationShortcutItemIconSymbolName":"shippingbox"}]' "$APP/Info.plist"
          plutil -replace CFBundleShortVersionString -string "4.11" "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "$APP/Info.plist"
          plutil -replace UIFileSharingEnabled -bool YES "$APP/Info.plist"
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool YES "$APP/Info.plist"
          plutil -replace NSSupportsLiveActivities -bool YES "$APP/Info.plist"
          plutil -replace NSSupportsLiveActivitiesFrequentUpdates -bool YES "$APP/Info.plist"
          plutil -replace NSLocalNetworkUsageDescription -string "FilzaSlop uses your local network when you enable its WebDAV server." "$APP/Info.plist"
          plutil -replace NSBonjourServices -json '["_http._tcp"]' "$APP/Info.plist"

          test -s "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          test -s "$APP/AppIconImage.png"
          test -s "$APP/Config.plist"
          test -s "$APP/Filza3105.bundle/Info.plist"
          test -x "$APP/helpers/FilzaWebDAVServer"
          otool -L "$APP/$EXECUTABLE" | grep -F 'FilzaApplySandboxExt.dylib'

          OUTPUT="$GITHUB_WORKSPACE/.theos/FilzaSlop-main-${GITHUB_SHA::7}-unsigned.ipa"
          rm -f "$OUTPUT"
          (cd "$STAGE" && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -tq "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          unzip -l "$OUTPUT" | grep -F 'Config.plist'
          shasum -a 256 "$OUTPUT" | tee .theos/IPA-SHA256.txt

      - name: Upload installable unsigned IPA and verification files
        uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-installable-unsigned-arm64
          path: |
            .theos/FilzaSlop-main-*-unsigned.ipa
            .theos/IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
            .theos/byetunes-resources/**
            .theos/byetunes-appintents/Metadata.appintents/**
            ThirdParty/3105/UPSTREAM.md
            ThirdParty/3105/LICENSE
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
