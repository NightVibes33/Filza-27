name: Verify Filza build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  real-arm64-build:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode and device SDK
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Install Theos
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

      - name: Build pinned idevice FFI for iOS arm64
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"
          test "$(cat Vendor/idevice/COMMIT)" = "37ee77cf713f483551f3cf33ea8b2087a40058ca"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          file Vendor/idevice/lib/libidevice_ffi.a

      - name: Syntax-check Apps Manager and ByeTunes subsystem
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON=(
            -isysroot "$SDK"
            -target arm64-apple-ios15.0
            -fmodules
            -fobjc-arc
            -fblocks
            -fsyntax-only
            -include errno.h
            -I.
            -IVendor/idevice/include
            -Wno-deprecated-declarations
            -Wno-arc-performSelector-leaks
          )
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppsMusicFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesMusicBridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" FilzaByeTunesUI.m

      - name: Verify integration invariants
        run: |
          set -euxo pipefail
          grep -q '^ARCHS = arm64$' Makefile
          grep -q 'AppsMusicFix.m' Makefile
          grep -q 'ByeTunesMusicBridge.m' Makefile
          grep -q 'FilzaByeTunesUI.m' Makefile
          grep -q 'libidevice_ffi.a' Makefile
          grep -q 'sqlite3' Makefile
          grep -q 'MCMEnumerateIdentifiersForClass(2' AppsMusicFix.m
          ! grep -q 'TGMusicLibraryViewController' AppsMusicFix.m
          grep -q 'tunnel_create_rppairing' ByeTunesMusicBridge.m
          grep -q '/iTunes_Control/iTunes/MediaLibrary.sqlitedb' ByeTunesMusicBridge.m
          grep -q '/iTunes_Control/Music' ByeTunesMusicBridge.m
          grep -q 'TGMusicLibraryViewController' FilzaByeTunesUI.m
          grep -q 'performActionForShortcutItem' FilzaByeTunesUI.m
          grep -q 'Music Library' FilzaByeTunesUI.m
          grep -q 'BTMusicEnsureLocalFile' FilzaByeTunesUI.m

      - name: Build and link real Filza tweak
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -f "$DYLIB"
          file "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          otool -L "$DYLIB"
          shasum -a 256 "$DYLIB"

      - name: Upload linked tweak
        uses: actions/upload-artifact@v4
        with:
          name: FilzaApplySandboxExt-arm64
          path: .theos/obj/FilzaApplySandboxExt.dylib
          retention-days: 14
