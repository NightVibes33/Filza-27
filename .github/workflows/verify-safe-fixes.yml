name: Verify Filza build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-full-byetunes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-arm64-build:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BYETUNES_COMMIT: 1a90f9e0f2b1a1787b208809ad2373f5c52175c8
      BAD_QUERY_COMMIT: 73ef6da1adabef0982fd00e36cb85f21b8f8194a
    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode, SDK, and pinned source dependencies
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"
          xcrun --sdk iphoneos --show-sdk-path
          test -d ByeTunes/MusicManager
          test "$(git -C ByeTunes rev-parse HEAD)" = "$BYETUNES_COMMIT"
          test -f ByeTunes/MusicManager/ContentView.swift
          test -f ByeTunes/MusicManager/MusicView.swift
          test -f ByeTunes/MusicManager/DownloadView.swift
          test -f ByeTunes/MusicManager/RingtonesView.swift
          test -f ByeTunes/MusicManager/SettingsView.swift
          test -f ByeTunes/MusicManager/MediaLibraryBuilder.swift
          test -f ByeTunes/MusicManager/iDeviceManager.swift
          test -f ByeTunes/MusicManager/MusicManagerIntents.swift
          test -f ByeTunes/MusicManager/YouTubeKit/SignatureSolver.swift
          test -f ByeTunes/MusicManager/YouTubeKit/Resources/meriyah.umd.js
          test -f ByeTunes/MusicManager/YouTubeKit/Resources/astring.umd.js
          test -f ByeTunes/MusicManager/YouTubeKit/Resources/yt_ejs_helper.js
          test -d ThirdParty/bad_query/bad_query
          test "$(git -C ThirdParty/bad_query rev-parse HEAD)" = "$BAD_QUERY_COMMIT"
          test -f ThirdParty/bad_query/bad_query/bad_query.c
          test -f ThirdParty/bad_query/bad_query/bad_query.h
          grep -Fq 'int64_t bad_query(char* path' ThirdParty/bad_query/bad_query/bad_query.c
          grep -Fq 'sandbox_extension_consume' ThirdParty/bad_query/bad_query/bad_query.c

      - name: Syntax-check Objective-C integration shell
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON=(
            -isysroot "$SDK"
            -target arm64-apple-ios16.0
            -fmodules
            -fobjc-arc
            -fblocks
            -fsyntax-only
            -include errno.h
            -I.
            -IThirdParty/bad_query/bad_query
            -Wno-deprecated-declarations
            -Wno-arc-performSelector-leaks
          )
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppsMusicFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppsManagerPresentationFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" AppProxyMetadataFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" VirtualBackendFix.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesMusicBridge.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ByeTunesFilzaLibraryEmbed.m
          xcrun --sdk iphoneos clang "${COMMON[@]}" ThirdParty/bad_query/bad_query/bad_query.c

      - name: Verify in-place ByeTunes and app-data fallback invariants
        run: |
          set -euxo pipefail
          grep -q '^ARCHS = arm64$' Makefile
          grep -q 'TARGET := iphone:clang:latest:16.0' Makefile
          grep -q 'ByeTunesFilzaLibraryEmbed.m' Makefile
          grep -q 'AppsManagerPresentationFix.m' Makefile
          grep -q 'AppProxyMetadataFix.m' Makefile
          grep -q 'VirtualBackendFix.m' Makefile
          ! grep -q 'ByeTunesFullAppLauncher.m' Makefile
          ! grep -q 'FilzaByeTunesUI.m' Makefile
          grep -q 'BYETUNES_SWIFT_FILES' Makefile
          grep -q "! -name 'MusicManagerApp.swift'" Makefile
          grep -q 'ByeTunesEmbeddedHost.swift' Makefile
          grep -q 'SwiftUI' Makefile
          grep -q 'AppIntents' Makefile
          grep -q 'PhotosUI' Makefile
          grep -q 'JavaScriptCore' Makefile
          grep -q 'libidevice_ffi.a' Makefile
          grep -q 'sqlite3' Makefile
          grep -q 'emit-const-values-path' Makefile
          grep -q '^BAD_QUERY_ROOT := ThirdParty/bad_query$' Makefile
          grep -Fq '$(BAD_QUERY_ROOT)/bad_query/bad_query.c' Makefile
          test -f scripts/generate-appintents-metadata.sh
          grep -q '#import "idevice.h"' FilzaApplySandboxExt-Bridging-Header.h
          grep -q 'UIHostingController(rootView: ContentView())' ByeTunesEmbeddedHost.swift
          grep -q 'makeLibraryViewController' ByeTunesEmbeddedHost.swift
          grep -q 'TGMusicLibraryViewController' ByeTunesFilzaLibraryEmbed.m
          grep -q 'makeLibraryViewController' ByeTunesFilzaLibraryEmbed.m
          grep -q 'addChildViewController' ByeTunesFilzaLibraryEmbed.m
          grep -q 'didMoveToParentViewController' ByeTunesFilzaLibraryEmbed.m
          ! grep -q 'presentViewController' ByeTunesFilzaLibraryEmbed.m
          grep -q 'MCMEnumerateIdentifiersForClass(2' AppsMusicFix.m
          grep -q 'FilzaActivateBadQueryForContainer' AppsMusicFix.m
          grep -q 'bad_query((char \*)container.fileSystemRepresentation' AppsMusicFix.m
          grep -q 'FilzaDirectoryCanEnumerate' AppsMusicFix.m
          ! grep -q 'TGMusicLibraryViewController' AppsMusicFix.m
          grep -Fq '[AppsPresentationFix]' AppsManagerPresentationFix.m
          grep -Fq 'setIconPath:' AppsManagerPresentationFix.m
          grep -Fq 'calculateDiskUsage' AppsManagerPresentationFix.m
          grep -Fq '[AppProxyMetadataFix]' AppProxyMetadataFix.m
          grep -Fq '_applicationIconImageForBundleIdentifier:format:scale:' AppProxyMetadataFix.m
          grep -Fq 'staticDiskUsage' AppProxyMetadataFix.m
          grep -Fq '[VirtualBackendFix]' VirtualBackendFix.m
          grep -Fq 'isDirectory' VirtualBackendFix.m
          grep -Fq 'MCMFilzaVirtualRoot' VirtualBackendFix.m
          grep -q 'tunnel_create_rppairing' ByeTunesMusicBridge.m
          grep -q '/iTunes_Control/iTunes/MediaLibrary.sqlitedb' ByeTunesMusicBridge.m
          grep -q '/iTunes_Control/Music' ByeTunesMusicBridge.m

          SWIFT_COUNT="$(find ByeTunes/MusicManager -type f -name '*.swift' ! -name 'MusicManagerApp.swift' | wc -l | tr -d ' ')"
          echo "Complete embedded ByeTunes Swift file count: $SWIFT_COUNT"
          test "$SWIFT_COUNT" -ge 30

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Install Theos
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

      - name: Build pinned idevice FFI for iOS arm64
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"
          test "$(cat Vendor/idevice/COMMIT)" = "37ee77cf713f483551f3cf33ea8b2087a40058ca"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          file Vendor/idevice/lib/libidevice_ffi.a

      - name: Build and link complete ByeTunes + Filza tweak
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:16.0
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -f "$DYLIB"
          file "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          otool -L "$DYLIB"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          grep -aFq '[ByeTunesPort]' "$DYLIB"
          grep -aFq 'TGMusicLibraryViewController' "$DYLIB"
          grep -aFq 'DownloadView' "$DYLIB"
          grep -aFq 'RingtonesView' "$DYLIB"
          grep -aFq 'SettingsView' "$DYLIB"
          grep -aFq 'MusicManagerShortcuts' "$DYLIB"
          grep -aFq '[AppsManagerFix][bad_query]' "$DYLIB"
          grep -aFq 'sandbox_extension_consume' "$DYLIB"
          grep -aFq '[AppsPresentationFix]' "$DYLIB"
          grep -aFq '[AppProxyMetadataFix]' "$DYLIB"
          grep -aFq '[VirtualBackendFix]' "$DYLIB"
          shasum -a 256 "$DYLIB"

      - name: Generate ByeTunes AppIntents metadata when Theos exposes constant values
        continue-on-error: true
        run: |
          set -euxo pipefail
          bash scripts/generate-appintents-metadata.sh .theos/byetunes-appintents
          test -d .theos/byetunes-appintents/Metadata.appintents
          test "$(find .theos/byetunes-appintents/Metadata.appintents -type f | wc -l | tr -d ' ')" -gt 0
          grep -aR -q 'InjectMusicIntent' .theos/byetunes-appintents/Metadata.appintents
          grep -aR -q 'InjectRingtoneIntent' .theos/byetunes-appintents/Metadata.appintents

      - name: Stage and verify complete ByeTunes runtime resources
        run: |
          set -euxo pipefail
          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources
          test -s .theos/byetunes-resources/meriyah.umd.js
          test -s .theos/byetunes-resources/astring.umd.js
          test -s .theos/byetunes-resources/yt_ejs_helper.js
          test -s .theos/byetunes-resources/AppIconImage.png
          plutil -lint .theos/byetunes-resources/ByeTunes-Info.plist
          test -s .theos/byetunes-resources/SHA256SUMS

      - name: Upload complete embedded target
        uses: actions/upload-artifact@v4
        with:
          name: FilzaApplySandboxExt-full-ByeTunes-arm64
          path: |
            .theos/obj/FilzaApplySandboxExt.dylib
            .theos/byetunes-resources/**
            .theos/byetunes-appintents/Metadata.appintents/**
          retention-days: 14
