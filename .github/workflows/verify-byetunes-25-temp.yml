name: Verify ByeTunes 2.5 temp branch

on:
  push:
    branches:
      - upstream/byetunes-2.5-preserve-pairing-test

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          set -euxo pipefail
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build idevice dependency
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/idevice/include/idevice.h

      - name: Build SSH verifier stack
        run: |
          set -euxo pipefail
          bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"
          test -s Vendor/ssh/lib/libssh.a
          test -s Vendor/ssh/lib/libmbedtls.a
          test -s Vendor/ssh/lib/libmbedx509.a
          test -s Vendor/ssh/lib/libmbedcrypto.a
          test -s Vendor/ssh/include/libssh/libssh.h

      - name: Build wolfSSH server stack
        run: |
          set -euxo pipefail
          bash scripts/build-wolfssh-stack.sh "$GITHUB_WORKSPACE/Vendor/wolfssh"
          test -s Vendor/wolfssh/lib/libwolfssh.a
          test -s Vendor/wolfssh/lib/libwolfssl.a
          test -s Vendor/wolfssh/include/wolfssh/ssh.h
          test -s Vendor/wolfssh/include/wolfssh/wolfsftp.h
          test -s Vendor/wolfssh/include/wolfssl/wolfcrypt/ecc.h

      - name: Build existing Filza integration
        run: |
          set -euxo pipefail
          export THEOS="$HOME/theos"
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          gmake clean package FINALPACKAGE=1

      - name: Upload build products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Filza-27-ByeTunes-2.5-temp
          path: packages/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
