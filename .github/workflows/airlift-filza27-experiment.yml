name: Verify ByeTunes + SSH IPA + AirCard + Embedded Yoink + Official iSH

on:
  push:
    branches: [ experiment/aircard-main-sync ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filza-aircard-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  AIRCARD_COMMIT: 740cfd9e7f00be77887638a3e65edbdb19ff1867
  THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
  IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
  LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
  MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
  WOLFSSH_COMMIT: e7c8dc2c2c54e5f0f2986be592e2243725a4dd33
  WOLFSSL_COMMIT: 9ab8a4b19debdade06b10d30cf70167de8f9b915
  BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
  BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa

jobs:
  ish-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rootfs recipe
        uses: actions/checkout@v4
      - name: Enable x86 emulation for Alpine i386
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 386
      - name: Install official iSH fakefs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld meson ninja-build libarchive-dev libsqlite3-dev
      - name: Build pinned Alpine i386 + ffmpeg fakefs
        run: |
          bash scripts/build-byetunes-ish-rootfs.sh "$GITHUB_WORKSPACE/.theos/ByeTunesISH.bundle"
          test -d .theos/ByeTunesISH.bundle/rootfs/data
          test -s .theos/ByeTunesISH.bundle/rootfs/meta.db
          grep -Eq '^ffmpeg-' .theos/ByeTunesISH.bundle/package-manifest.txt
          grep -Fq '"youtube": false' .theos/ByeTunesISH.bundle/provenance.json
      - name: Upload official iSH rootfs
        uses: actions/upload-artifact@v4
        with:
          name: byetunes-official-ish-rootfs
          path: .theos/ByeTunesISH.bundle/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7


  ish-runtime-smoke:
    needs: ish-rootfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime smoke recipe
        uses: actions/checkout@v4

      - name: Download exact packaged official iSH rootfs
        uses: actions/download-artifact@v4
        with:
          name: byetunes-official-ish-rootfs
          path: .ci/ByeTunesISH.bundle

      - name: Install official iSH CLI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld meson ninja-build libarchive-dev libsqlite3-dev

      - name: Build pinned official iSH CLI
        run: |
          set -euxo pipefail
          ISH_COMMIT="$(python3 -c 'import json; print(json.load(open("ByeTunesLocal/iSH/ish.lock"))["commit"])')"
          git clone --filter=blob:none https://github.com/ish-app/ish.git .ci/ish-cli
          git -C .ci/ish-cli checkout --detach "$ISH_COMMIT"
          git -C .ci/ish-cli submodule update --init --recursive
          meson setup .ci/ish-cli/build .ci/ish-cli --buildtype=release
          ninja -C .ci/ish-cli/build ish
          test -x .ci/ish-cli/build/ish

      - name: Boot packaged fakefs and prove FFmpeg track finishing
        run: |
          set -euxo pipefail
          ISH=".ci/ish-cli/build/ish"
          ROOTFS=".ci/ByeTunesISH.bundle/rootfs"

          test -d "$ROOTFS/data"
          test -s "$ROOTFS/meta.db"

          "$ISH" -f "$ROOTFS" /usr/bin/ffmpeg -version
          "$ISH" -f "$ROOTFS" /usr/bin/ffprobe -version
          "$ISH" -f "$ROOTFS" /usr/bin/curl --version

          "$ISH" -f "$ROOTFS" /bin/busybox mkdir -p /tmp
          "$ISH" -f "$ROOTFS" /bin/busybox chmod 1777 /tmp
          "$ISH" -f "$ROOTFS" /bin/busybox dd if=/dev/zero of=/tmp/byetunes-selftest.raw bs=16000 count=1

          "$ISH" -f "$ROOTFS" /usr/bin/ffmpeg             -hide_banner -loglevel error -y             -f s16le -ar 8000 -ac 1 -i /tmp/byetunes-selftest.raw             -c:a libmp3lame -b:a 128k             -metadata "title=ByeTunes Local Self Test"             -metadata "artist=Filza 27"             -metadata "lyrics=[00:00.00]self test"             /tmp/byetunes-selftest.mp3

          "$ISH" -f "$ROOTFS" /usr/bin/ffmpeg             -hide_banner -loglevel error -y             -f s16le -ar 8000 -ac 1 -i /tmp/byetunes-selftest.raw             -c:a flac             -metadata "title=ByeTunes Local Self Test FLAC"             -metadata "artist=Filza 27"             -metadata "lyrics=[00:00.00]self test flac"             /tmp/byetunes-selftest.flac

          "$ISH" -f "$ROOTFS" /usr/bin/ffprobe             -v error             -show_entries "format=format_name,duration:format_tags=title,artist,lyrics"             -of json /tmp/byetunes-selftest.mp3 | tee .ci/ffprobe-mp3.json

          "$ISH" -f "$ROOTFS" /usr/bin/ffprobe             -v error             -show_entries "format=format_name,duration:format_tags=title,artist,lyrics"             -of json /tmp/byetunes-selftest.flac | tee .ci/ffprobe-flac.json

          grep -Fq 'ByeTunes Local Self Test' .ci/ffprobe-mp3.json
          grep -Fq 'Filza 27' .ci/ffprobe-mp3.json
          grep -Fq 'self test' .ci/ffprobe-mp3.json
          grep -Fq 'ByeTunes Local Self Test FLAC' .ci/ffprobe-flac.json
          grep -Fq 'self test flac' .ci/ffprobe-flac.json

      - name: Upload official iSH finishing smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: byetunes-ish-runtime-smoke
          path: |
            .ci/ffprobe-mp3.json
            .ci/ffprobe-flac.json
          if-no-files-found: error
          retention-days: 7

  arm64-ipa:
    needs: [ish-rootfs, ish-runtime-smoke]
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete combined source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download pinned official iSH rootfs
        uses: actions/download-artifact@v4
        with:
          name: byetunes-official-ish-rootfs
          path: .ci/ByeTunesISH.bundle

      - name: Setup Node 24 for embedded Yoink bundle
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify main + AirCard integration wiring
        run: |
          set -euxo pipefail
          grep -F "$AIRCARD_COMMIT" scripts/stage-aircard.sh
          grep -F 'FilzaFeatureAirCard' FilzaQuickActions.m
          grep -F 'FilzaAirCardPresentFromController' FilzaFeatureRouter.m
          grep -F 'FilzaAirCardBridge.m' Makefile
          grep -F 'FilzaAirCardHost.swift' Makefile
          grep -F 'FilzaAirCardDirectBackend.m' Makefile
          grep -F 'TendiesEngine.swift' Makefile
          grep -F 'RespringHelper.swift' Makefile
          grep -F 'patch-aircard-embedded-parity.py' Makefile
          grep -F 'Choose Pairing File from Files…' scripts/patch-aircard-embedded-parity.py
          grep -F 'FilzaEmbeddedPanelPresentation.configure(c)' FilzaAirCardHost.swift
          grep -F 'al_filza_fs_list' scripts/stage-aircard.sh
          grep -F 'al_filza_fs_read' scripts/stage-aircard.sh
          grep -F 'AirCard owns the Airlift/idevice runtime' RuntimeStability.m
          ! grep -F 'FILZA_AIRCARD_STREAM_COMPAT' scripts/stage-aircard.sh
          grep -F 'ByeTunesLocal/NodeRuntime/ByeTunesNodeRuntime.mm' Makefile
          grep -F 'stage-byetunes-node-mobile.sh' Makefile
          grep -F 'build-byetunes-embedded-yoink.sh' Makefile
          grep -F 'stage-official-ish.sh' Makefile
          grep -F 'ByeTunesLocal/iSH/ByeTunesISHRuntime.m' Makefile
          grep -F 'ByeTunesISHRuntimeInstall' ByeTunesLocal/NodeRuntime/ByeTunesNodeRuntime.mm
          grep -F '83348361fe65311f6e87ad2e1cbb0ac38d123f69' ByeTunesLocal/iSH/ish.lock
          grep -F 'ByeTunesNodeRuntimeInstall();' Tweak.m
          grep -F '"youtube": false' ByeTunesLocal/NodeRuntime/node-mobile.lock >/dev/null 2>&1 || true

      - name: Install official iSH build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm lld meson ninja
          LLVM_BIN="$(brew --prefix llvm)/bin"
          LLD_BIN="$(brew --prefix lld)/bin"
          test -x "$LLVM_BIN/clang"
          test -x "$LLD_BIN/ld.lld"
          echo "$LLD_BIN" >> "$GITHUB_PATH"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          "$LLVM_BIN/clang" --version
          "$LLD_BIN/ld.lld" --version

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Restore pinned SSH stack cache
        id: ssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/ssh
          key: ssh-stack-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}-${{ hashFiles('scripts/build-ssh-stack.sh') }}

      - name: Build pinned SSH stack
        if: steps.ssh-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"

      - name: Restore pinned wolfSSH server cache
        id: wolfssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/wolfssh
          key: wolfssh-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios17-${{ env.WOLFSSH_COMMIT }}-${{ env.WOLFSSL_COMMIT }}-${{ hashFiles('scripts/build-wolfssh-stack.sh', 'scripts/wolfssh-allow-multiple-session-channels.patch') }}

      - name: Build pinned wolfSSH server stack
        if: steps.wolfssh-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-wolfssh-stack.sh "$GITHUB_WORKSPACE/Vendor/wolfssh"

      - name: Build complete Filza + AirCard target once
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/ssh/lib/libssh.a
          test -s Vendor/wolfssh/lib/libwolfssh.a
          test -s Vendor/wolfssh/lib/libwolfssl.a
          mkdir -p .theos
          gmake clean >/dev/null 2>&1 || true
          rm -rf .theos/byetunes-ish-bundle
          mkdir -p .theos/byetunes-ish-bundle
          cp -R .ci/ByeTunesISH.bundle/. .theos/byetunes-ish-bundle/
          set -o pipefail
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:17.0 2>&1 | tee .theos/aircard-build.log
          DYLIB=.theos/obj/FilzaApplySandboxExt.dylib
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = arm64
          grep -aFq 'AirCardEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.aircard' "$DYLIB"
          grep -aFq 'direct normal-path AFC fallback installed' "$DYLIB"
          grep -aFq 'al_filza_fs_list' "$DYLIB"
          grep -aFq 'al_filza_fs_read' "$DYLIB"
          grep -aFq 'ByeTunesLocal' "$DYLIB"
          nm "$DYLIB" | grep -F 'node_start'
          test -s .theos/byetunes-yoink-bundle/server.js
          test -s .theos/byetunes-yoink-bundle/provenance.json
          grep -Fq '"youtube": false' .theos/byetunes-yoink-bundle/provenance.json
          test -s Vendor/iSH/lib/libish.a
          test -s Vendor/iSH/lib/libish_emu.a
          test -s Vendor/iSH/lib/libfakefs.a
          test -d .theos/byetunes-ish-bundle/rootfs/data
          test -s .theos/byetunes-ish-bundle/rootfs/meta.db
          grep -Eq '^ffmpeg-' .theos/byetunes-ish-bundle/package-manifest.txt
          grep -aFq 'ByeTunesISH' "$DYLIB"

      - name: Generate runtime resources
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/generate-appintents-metadata.sh .theos/byetunes-appintents
          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources

      - name: Download verified unsigned Filza base
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 10 --retry-all-errors --retry-delay 3 --connect-timeout 30 "$BASE_IPA_URL" -o .theos/FilzaSlop-base-unsigned.ipa
          echo "$BASE_IPA_SHA256  .theos/FilzaSlop-base-unsigned.ipa" | shasum -a 256 -c -

      - name: Package modern unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d /tmp/filza-aircard-ipa.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          unzip -q .theos/FilzaSlop-base-unsigned.ipa -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          codesign --remove-signature "$APP/Frameworks/FilzaApplySandboxExt.dylib" >/dev/null 2>&1 || true

          cp .theos/byetunes-resources/AppIconImage.png "$APP/AppIconImage.png"
          cp .theos/byetunes-resources/ByeTunes-Info.plist "$APP/ByeTunes-Info.plist"
          cp .theos/byetunes-resources/Config.plist "$APP/Config.plist"

          rm -rf "$APP/ByeTunesYoink.bundle"
          mkdir -p "$APP/ByeTunesYoink.bundle"
          cp -R .theos/byetunes-yoink-bundle/. "$APP/ByeTunesYoink.bundle/"

          rm -rf "$APP/ByeTunesISH.bundle"
          mkdir -p "$APP/ByeTunesISH.bundle"
          cp -R .theos/byetunes-ish-bundle/. "$APP/ByeTunesISH.bundle/"

          # NodeMobile is normally a static framework. If this pinned release
          # ever changes to a dynamic framework, embed exactly the linked binary.
          if otool -L "$APP/Frameworks/FilzaApplySandboxExt.dylib" | grep -Fq 'NodeMobile.framework/NodeMobile'; then
            rm -rf "$APP/Frameworks/NodeMobile.framework"
            cp -R Vendor/NodeMobile/NodeMobile.framework "$APP/Frameworks/NodeMobile.framework"
            codesign --remove-signature "$APP/Frameworks/NodeMobile.framework/NodeMobile" >/dev/null 2>&1 || true
          fi

          rm -rf "$APP/MondEmbedded.bundle" "$APP/Filza3105.bundle"
          cp -R ThirdParty/mond-current/Resources/MondEmbedded.bundle "$APP/MondEmbedded.bundle"
          cp -R ThirdParty/3105/Resources/Filza3105.bundle "$APP/Filza3105.bundle"

          plutil -replace MinimumOSVersion -string "17.0" "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "$APP/Info.plist"
          plutil -replace UIFileSharingEnabled -bool YES "$APP/Info.plist"
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool YES "$APP/Info.plist"
          plutil -replace NSLocalNetworkUsageDescription -string "Filza 27 uses your local network for AirCard pairing, WebDAV, SSH/SFTP, and the on-device ByeTunes service." "$APP/Info.plist"

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as fh:
              info = plistlib.load(fh)
          ats = dict(info.get('NSAppTransportSecurity', {}))
          ats['NSAllowsLocalNetworking'] = True
          info['NSAppTransportSecurity'] = ats
          with open(path, 'wb') as fh:
              plistlib.dump(info, fh, sort_keys=False)
          PY
          plutil -replace NSPhotoLibraryUsageDescription -string "Filza 27 AirCard needs photo access to apply custom card skins and passcode themes." "$APP/Info.plist"
          plutil -replace NSBonjourServices -json '["_http._tcp","_ssh._tcp","_remotepairing-pairable-host._tcp","_aircardprobe._tcp"]' "$APP/Info.plist"
          plutil -remove UIBackgroundModes "$APP/Info.plist" 2>/dev/null || true
          plutil -insert UIBackgroundModes -json '["audio"]' "$APP/Info.plist"
          plutil -remove LSApplicationQueriesSchemes "$APP/Info.plist" 2>/dev/null || true
          plutil -insert LSApplicationQueriesSchemes -json '["localdevvpn","prefs","app-prefs","App-prefs","App-Prefs"]' "$APP/Info.plist"
          bash scripts/merge-3105-app-metadata.sh "$APP/Info.plist"

          # Merge AirCard v1.3's document/UTI declarations without replacing 3105's metadata.
          python3 - "$APP/Info.plist" ThirdParty/AirCard/ios-app/Info.plist <<'PY'
          import plistlib, sys
          dst_path, aircard_path = sys.argv[1], sys.argv[2]
          with open(dst_path, 'rb') as fh: dst = plistlib.load(fh)
          with open(aircard_path, 'rb') as fh: src = plistlib.load(fh)
          for key in ("CFBundleDocumentTypes", "UTImportedTypeDeclarations", "UTExportedTypeDeclarations"):
              current = list(dst.get(key, []))
              seen = {repr(x) for x in current}
              for item in src.get(key, []):
                  if repr(item) not in seen:
                      current.append(item); seen.add(repr(item))
              dst[key] = current
          with open(dst_path, 'wb') as fh: plistlib.dump(dst, fh, sort_keys=False)
          PY

          # One routing table, two surfaces: exactly four canonical integrations.
          plutil -remove UIApplicationShortcutItems "$APP/Info.plist" 2>/dev/null || true
          plutil -insert UIApplicationShortcutItems -json '[
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.apps-manager","UIApplicationShortcutItemTitle":"App Manager","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeFavorite"},
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.music-library","UIApplicationShortcutItemTitle":"Music","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeAudio"},
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.gestalt-manager","UIApplicationShortcutItemTitle":"Gestalt","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeTask"},
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.aircard","UIApplicationShortcutItemTitle":"AirCard","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeShare"}
          ]' "$APP/Info.plist"

          DYLIB="$APP/Frameworks/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          grep -aFq 'AirCardEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'com.nightvibes33.filzaslop.aircard' "$DYLIB"
          grep -aFq 'al_filza_fs_list' "$DYLIB"
          test -s "$APP/MondEmbedded.bundle/Info.plist"
          test -s "$APP/Filza3105.bundle/UpstreamAppInfo.plist"
          test -s "$APP/Config.plist"
          test -s "$APP/ByeTunesYoink.bundle/server.js"
          test -s "$APP/ByeTunesYoink.bundle/provenance.json"
          test -d "$APP/ByeTunesISH.bundle/rootfs/data"
          test -s "$APP/ByeTunesISH.bundle/rootfs/meta.db"
          test -s "$APP/ByeTunesISH.bundle/ISH-LICENSE.md"
          grep -Eq '^ffmpeg-' "$APP/ByeTunesISH.bundle/package-manifest.txt"
          grep -Fq '"youtube": false' "$APP/ByeTunesYoink.bundle/provenance.json"
          test "$(plutil -extract ByeTunesApiUrl raw -o - "$APP/Config.plist")" = "http://127.0.0.1:41337"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as fh:
              info = plistlib.load(fh)
          ats = info.get('NSAppTransportSecurity', {})
          assert ats.get('NSAllowsLocalNetworking') is True, ats
          assert ats.get('NSAllowsArbitraryLoads') is not True, ats
          PY
          grep -aFq 'Tendies' "$DYLIB"
          grep -aFq 'NeoSpring' "$DYLIB"

          # Artifact-level navigation contract: four entries, no split 3105 Apps/Patches routes.
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as fh:
              info = plistlib.load(fh)
          items = info.get('UIApplicationShortcutItems', [])
          expected = [
              'com.nightvibes33.filzaslop.apps-manager',
              'com.nightvibes33.filzaslop.music-library',
              'com.nightvibes33.filzaslop.gestalt-manager',
              'com.nightvibes33.filzaslop.aircard',
          ]
          actual = [item.get('UIApplicationShortcutItemType') for item in items]
          assert actual == expected, f'wrong shortcut contract: {actual!r}'
          assert 'com.nightvibes33.filzaslop.patches' not in actual
          PY
          nm -gU "$DYLIB" > "$STAGE/filza-symbols.txt"
          grep -Fq '_Filza3105PresentHomeFromController' "$STAGE/filza-symbols.txt"
          grep -Fq '_FilzaByeTunesPresentFromController' "$STAGE/filza-symbols.txt"
          grep -Fq '_FilzaMondPresentFromController' "$STAGE/filza-symbols.txt"
          grep -Fq '_FilzaAirCardPresentFromController' "$STAGE/filza-symbols.txt"
          grep -aFq 'canonical Apps Manager/Music/Gestalt/AirCard launchers installed' "$DYLIB"

          OUTPUT="$GITHUB_WORKSPACE/.theos/Filza-27-modern-${GITHUB_SHA::7}-unsigned.ipa"
          (cd "$STAGE" && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -tq "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'Payload/'
          unzip -l "$OUTPUT" | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          unzip -l "$OUTPUT" | grep -F 'MondEmbedded.bundle/Info.plist'
          unzip -l "$OUTPUT" | grep -F 'Filza3105.bundle/UpstreamAppInfo.plist'
          unzip -l "$OUTPUT" | grep -F 'ByeTunesYoink.bundle/server.js'
          unzip -l "$OUTPUT" | grep -F 'ByeTunesYoink.bundle/provenance.json'
          unzip -l "$OUTPUT" | grep -F 'ByeTunesISH.bundle/rootfs/meta.db'
          unzip -l "$OUTPUT" | grep -F 'ByeTunesISH.bundle/package-manifest.txt'
          shasum -a 256 "$OUTPUT" | tee .theos/IPA-SHA256.txt

      - name: Upload modern unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Filza-27-modern-unsigned-arm64
          path: |
            .theos/Filza-27-modern-*-unsigned.ipa
            .theos/IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
