name: Temp reapply Filza integration onto pristine 3105

on:
  push:
    branches:
      - temp-3105-pristine-rebase

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-26-intel
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reapply Filza integration
        shell: bash
        run: bash scripts/temp-reapply-3105-fixed3.sh
