name: Apply bad_query container discovery fix

on:
  push:
    branches:
      - fix-badquery-container-discovery-20260813
    paths:
      - .github/workflows/badquery-container-discovery-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-badquery-container-discovery-20260813
          fetch-depth: 0

      - name: Apply published container discovery path
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AppsMusicFix.m')
          text = path.read_text()

          if '#import <stdlib.h>' not in text:
              text = text.replace('#import <string.h>\n', '#import <string.h>\n#import <stdlib.h>\n', 1)

          old_globals = '''static NSMutableDictionary<NSString *, NSNumber *> *gBadQueryHandles;
          static const uint64_t kFilzaClass2LookupFlags = 0x900000000ULL;
          '''
          new_globals = '''static NSMutableDictionary<NSString *, NSNumber *> *gBadQueryHandles;
          static NSMutableDictionary<NSString *, NSString *> *gBadQueryContainerPaths;
          static BOOL gBadQueryContainerDiscoveryStarted = NO;
          static BOOL gBadQueryContainerDiscoveryFinished = NO;
          static const uint64_t kFilzaClass2LookupFlags = 0x900000000ULL;
          static const int64_t kFilzaBadQueryMaxInode = 2000000;
          static NSString *const kFilzaAppDataRoot = @"/var/mobile/Containers/Data/Application";
          '''
          if old_globals in text:
              text = text.replace(old_globals, new_globals, 1)
          elif 'gBadQueryContainerPaths' not in text:
              raise SystemExit('global anchor not found')

          old_state = '''    dispatch_once(&onceToken, ^{
                  gBadQueryHandles = [NSMutableDictionary dictionary];
              });
          '''
          new_state = '''    dispatch_once(&onceToken, ^{
                  gBadQueryHandles = [NSMutableDictionary dictionary];
                  gBadQueryContainerPaths = [NSMutableDictionary dictionary];
              });
          '''
          if old_state in text:
              text = text.replace(old_state, new_state, 1)
          elif 'gBadQueryContainerPaths = [NSMutableDictionary dictionary]' not in text:
              raise SystemExit('state anchor not found')

          insert_anchor = '''static NSString *FilzaBadQueryFailureDescription(int64_t result)
          {
          '''
          if 'FilzaStartBadQueryContainerDiscovery' not in text:
              helpers = r'''static BOOL FilzaIsDirectAppDataContainerPath(NSString *path)
          {
              if (!path.length || !path.isAbsolutePath) return NO;
              NSString *normalized = path.stringByStandardizingPath;
              if ([normalized hasPrefix:@"/private/var/"])
                  normalized = [normalized substringFromIndex:8];
              NSString *prefix = [kFilzaAppDataRoot stringByAppendingString:@"/"];
              if (![normalized hasPrefix:prefix]) return NO;
              NSString *leaf = [normalized substringFromIndex:prefix.length];
              if (!leaf.length || [leaf containsString:@"/"]) return NO;
              return [[NSUUID alloc] initWithUUIDString:leaf] != nil;
          }

          static void FilzaDiscoverBadQueryContainers(void)
          {
              NSInteger major = NSProcessInfo.processInfo.operatingSystemVersion.majorVersion;
              if (major < 26 || major > 27) {
                  @synchronized (gBadQueryContainerPaths) {
                      gBadQueryContainerDiscoveryFinished = YES;
                  }
                  return;
              }

              char *listingRaw = bad_query_list((char *)kFilzaAppDataRoot.fileSystemRepresentation,
                                                kFilzaBadQueryMaxInode);
              if (!listingRaw) {
                  NSLog(@"[AppsManagerFix][bad_query_list] failed root=%@ maxInode=%lld",
                        kFilzaAppDataRoot, kFilzaBadQueryMaxInode);
                  @synchronized (gBadQueryContainerPaths) {
                      gBadQueryContainerDiscoveryFinished = YES;
                  }
                  return;
              }

              NSString *listing = [NSString stringWithUTF8String:listingRaw] ?: @"";
              free(listingRaw);
              NSUInteger candidates = 0;
              NSUInteger activated = 0;
              NSUInteger mapped = 0;

              for (NSString *rawLine in [listing componentsSeparatedByCharactersInSet:[NSCharacterSet newlineCharacterSet]]) {
                  NSString *container = [rawLine stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  if (!FilzaIsDirectAppDataContainerPath(container)) continue;
                  candidates++;

                  int64_t handle = bad_query((char *)container.fileSystemRepresentation,
                                             true, NULL, false);
                  if (handle < 0) continue;
                  activated++;

                  NSString *metadataPath = [container stringByAppendingPathComponent:
                      @".com.apple.mobile_container_manager.metadata.plist"];
                  NSDictionary *metadata = [NSDictionary dictionaryWithContentsOfFile:metadataPath];
                  NSString *identifier = [metadata[@"MCMMetadataIdentifier"] isKindOfClass:NSString.class]
                      ? metadata[@"MCMMetadataIdentifier"] : nil;
                  if (identifier.length) {
                      @synchronized (gBadQueryContainerPaths) {
                          gBadQueryContainerPaths[identifier] = container;
                      }
                      mapped++;
                  }
                  bad_query_release(handle);
              }

              @synchronized (gBadQueryContainerPaths) {
                  gBadQueryContainerDiscoveryFinished = YES;
              }
              NSLog(@"[AppsManagerFix][bad_query_list] root=%@ maxInode=%lld candidates=%lu activated=%lu mapped=%lu",
                    kFilzaAppDataRoot, kFilzaBadQueryMaxInode,
                    (unsigned long)candidates, (unsigned long)activated, (unsigned long)mapped);
          }

          static void FilzaStartBadQueryContainerDiscovery(void)
          {
              FilzaEnsureBadQueryState();
              @synchronized (gBadQueryContainerPaths) {
                  if (gBadQueryContainerDiscoveryStarted) return;
                  gBadQueryContainerDiscoveryStarted = YES;
              }
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  FilzaDiscoverBadQueryContainers();
              });
          }

          static NSString *FilzaBadQueryContainerPathForIdentifier(NSString *identifier,
                                                                    NSString **error)
          {
              if (!identifier.length) {
                  if (error) *error = @"missing identifier for bad_query_list lookup";
                  return nil;
              }
              FilzaStartBadQueryContainerDiscovery();
              @synchronized (gBadQueryContainerPaths) {
                  NSString *cached = gBadQueryContainerPaths[identifier];
                  if (cached.length) {
                      if (error) *error = @"bad_query_list metadata map resolved container";
                      return cached.copy;
                  }
                  if (error) {
                      *error = gBadQueryContainerDiscoveryFinished
                          ? @"bad_query_list completed without a matching MCMMetadataIdentifier"
                          : @"bad_query_list container discovery is still running";
                  }
              }
              return nil;
          }

          '''
              idx = text.find(insert_anchor)
              if idx < 0:
                  raise SystemExit('helper insertion anchor not found')
              text = text[:idx] + helpers + text[idx:]

          old_fallback = '''        NSString *lookupDetail = nil;
                  NSString *rawContainer = FilzaRawClass2ContainerPath(identifier, &lookupDetail);
                  NSString *fallbackDetail = nil;
                  if (!rawContainer.length ||
                      !FilzaActivateBadQueryForContainer(identifier, rawContainer, &fallbackDetail)) {
                      if (error) {
                          *error = [NSString stringWithFormat:
                              @"MHA class-2 activation failed: %@; raw lookup: %@; bad_query fallback: %@",
                              activationDetail ?: @"unknown",
                              lookupDetail ?: @"no detail",
                              fallbackDetail ?: @"not available"];
                      }
                      return nil;
                  }
          '''
          new_fallback = '''        NSString *lookupDetail = nil;
                  NSString *rawContainer = FilzaRawClass2ContainerPath(identifier, &lookupDetail);
                  NSString *discoveryDetail = nil;
                  if (!rawContainer.length)
                      rawContainer = FilzaBadQueryContainerPathForIdentifier(identifier, &discoveryDetail);
                  NSString *fallbackDetail = nil;
                  if (!rawContainer.length ||
                      !FilzaActivateBadQueryForContainer(identifier, rawContainer, &fallbackDetail)) {
                      if (error) {
                          *error = [NSString stringWithFormat:
                              @"MHA class-2 activation failed: %@; raw lookup: %@; published bad_query_list discovery: %@; bad_query fallback: %@",
                              activationDetail ?: @"unknown",
                              lookupDetail ?: @"no detail",
                              discoveryDetail ?: @"not needed",
                              fallbackDetail ?: @"not available"];
                      }
                      return nil;
                  }
          '''
          if old_fallback in text:
              text = text.replace(old_fallback, new_fallback, 1)
          elif 'published bad_query_list discovery' not in text:
              raise SystemExit('fallback anchor not found')

          old_ctor = '''__attribute__((constructor)) static void FilzaAppsManagerFixInit(void)
          {
              dispatch_async(dispatch_get_main_queue(), ^{
          '''
          new_ctor = '''__attribute__((constructor)) static void FilzaAppsManagerFixInit(void)
          {
              FilzaStartBadQueryContainerDiscovery();
              dispatch_async(dispatch_get_main_queue(), ^{
          '''
          if old_ctor in text:
              text = text.replace(old_ctor, new_ctor, 1)
          elif 'FilzaStartBadQueryContainerDiscovery();' not in text[text.rfind('__attribute__((constructor))'):]:
              raise SystemExit('constructor anchor not found')

          path.write_text(text)

          script = Path('scripts/patch-byetunes-embedded.sh')
          s = script.read_text()
          anchor = '''device.write_text(ds)

          cs = content.read_text()
          '''
          if 'pairing validation deferred' not in s:
              replacement = '''init_start = ds.find("    private init() {")
          if init_start < 0:
              raise SystemExit('DeviceManager private init not found')
          init_end = ds.find("\\n    private func ", init_start)
          if init_end < 0:
              init_end = len(ds)
          init_block = ds[init_start:init_end]
          old_refresh = "        refreshExpectedPairingFileState()\\n"
          new_refresh = ''' + "'''" + '''        hasValidExpectedPairingFile = false
                  Logger.shared.log("[DeviceManager] Filza embed: pairing validation deferred until explicit import")
          ''' + "'''" + '''
          if old_refresh in init_block:
              init_block = init_block.replace(old_refresh, new_refresh, 1)
              ds = ds[:init_start] + init_block + ds[init_end:]
          elif 'pairing validation deferred until explicit import' not in init_block:
              raise SystemExit('DeviceManager init refresh anchor not found')

          device.write_text(ds)

          cs = content.read_text()
          '''
              if anchor not in s:
                  raise SystemExit('ByeTunes patch script anchor not found')
              s = s.replace(anchor, replacement, 1)
              verify_anchor = '''grep -Fq 'Filza embed: transport startup deferred until explicit pairing import' "$CONTENT"
          '''
              verify_new = verify_anchor + '''grep -Fq 'Filza embed: pairing validation deferred until explicit import' "$DEVICE"
          '''
              if verify_anchor not in s:
                  raise SystemExit('ByeTunes verify anchor not found')
              s = s.replace(verify_anchor, verify_new, 1)
              script.write_text(s)
          PY

          grep -Fq 'bad_query_list((char *)kFilzaAppDataRoot.fileSystemRepresentation' AppsMusicFix.m
          grep -Fq 'MCMMetadataIdentifier' AppsMusicFix.m
          grep -Fq 'kFilzaBadQueryMaxInode = 2000000' AppsMusicFix.m
          grep -Fq 'pairing validation deferred until explicit import' scripts/patch-byetunes-embedded.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppsMusicFix.m scripts/patch-byetunes-embedded.sh
          git diff --cached --check
          git diff --cached
          git commit -m 'Use published bad_query_list fallback for foreign app containers'
          git push origin HEAD:fix-badquery-container-discovery-20260813
