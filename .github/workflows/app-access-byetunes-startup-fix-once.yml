name: Apply app-access and embedded ByeTunes startup fixes

on:
  push:
    branches:
      - fix-ios27-app-access-byetunes-startup-20260812
    paths:
      - .github/workflows/app-access-byetunes-startup-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ios27-app-access-byetunes-startup-20260812
          fetch-depth: 0

      - name: Apply exact source patches
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          p = Path('AppsMusicFix.m')
          s = p.read_text()
          old = '''static NSString *FilzaProxyIdentifier(id proxy)
          {
              SEL selector = NSSelectorFromString(@"applicationIdentifier");
              if ([proxy respondsToSelector:selector])
                  return ((id (*)(id, SEL))objc_msgSend)(proxy, selector);
              return nil;
          }
          '''
          new = '''static NSString *FilzaProxyIdentifier(id proxy)
          {
              for (NSString *name in @[@"applicationIdentifier", @"bundleIdentifier"]) {
                  SEL selector = NSSelectorFromString(name);
                  if (![proxy respondsToSelector:selector]) continue;
                  id value = ((id (*)(id, SEL))objc_msgSend)(proxy, selector);
                  if ([value isKindOfClass:NSString.class] && [value length]) return value;
              }
              return nil;
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected one FilzaProxyIdentifier block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old_list = '@[@"bundleId", @"applicationIdentifier"]'
          new_list = '@[@"bundleId", @"applicationIdentifier", @"bundleIdentifier"]'
          if s.count(old_list) != 1:
              raise SystemExit(f'expected one item identifier list, found {s.count(old_list)}')
          p.write_text(s.replace(old_list, new_list, 1))

          makefile = Path('Makefile')
          m = makefile.read_text()
          needle = 'before-FilzaApplySandboxExt-all::\n\t@test -s "$(IDEVICE_STATIC)"'
          replacement = 'before-FilzaApplySandboxExt-all::\n\t@bash scripts/patch-byetunes-embedded.sh\n\t@test -s "$(IDEVICE_STATIC)"'
          if m.count(needle) != 1:
              raise SystemExit(f'expected one before target anchor, found {m.count(needle)}')
          makefile.write_text(m.replace(needle, replacement, 1))
          PY

          cat > scripts/patch-byetunes-embedded.sh <<'SH'
          #!/bin/bash
          set -euo pipefail

          DEVICE="ByeTunes/MusicManager/iDeviceManager.swift"
          CONTENT="ByeTunes/MusicManager/ContentView.swift"
          test -f "$DEVICE"
          test -f "$CONTENT"

          python3 - "$DEVICE" "$CONTENT" <<'PY'
          from pathlib import Path
          import sys

          device = Path(sys.argv[1])
          content = Path(sys.argv[2])

          ds = device.read_text()
          old_logger = '''        let logPath = FileManager.default.temporaryDirectory.appendingPathComponent("idevice-logs.txt").path
                  let cString = strdup(logPath)
                  defer { free(cString) }
                  idevice_init_logger(Info, Disabled, cString)
          '''
          new_logger = '''        // Filza owns this process. Do not initialize idevice's process-global
                  // tracing/FFI logger while SwiftUI is still constructing the embedded root.
                  // Transport initialization remains available from the explicit pairing/import flow.
                  Logger.shared.log("[DeviceManager] Filza embed: deferred idevice logger initialization")
          '''
          if old_logger in ds:
              ds = ds.replace(old_logger, new_logger, 1)
          elif new_logger not in ds:
              raise SystemExit('embedded DeviceManager logger patch anchor not found')
          device.write_text(ds)

          cs = content.read_text()
          old_startup = '''            manager.refreshExpectedPairingFileState()
                      hasCompletedOnboarding = manager.hasValidExpectedPairingFile || manager.needsRPPairingFileUpgrade
                      if manager.hasValidExpectedPairingFile {
                          manager.startHeartbeat()
                      }
          '''
          new_startup = '''            // Filza embed: mount the full ByeTunes UI before touching idevice/RP FFI.
                      // The existing onboarding/import action remains the explicit transport entry point.
                      hasCompletedOnboarding = false
                      Logger.shared.log("[ContentView] Filza embed: transport startup deferred until explicit pairing import")
          '''
          if old_startup in cs:
              cs = cs.replace(old_startup, new_startup, 1)
          elif new_startup not in cs:
              raise SystemExit('embedded ContentView startup patch anchor not found')
          content.write_text(cs)
          PY

          grep -Fq 'Filza embed: deferred idevice logger initialization' "$DEVICE"
          grep -Fq 'Filza embed: transport startup deferred until explicit pairing import' "$CONTENT"
          ! grep -A12 -F 'private init() {' "$DEVICE" | grep -Fq 'idevice_init_logger('
          SH

          grep -Fq '@[@"applicationIdentifier", @"bundleIdentifier"]' AppsMusicFix.m
          grep -Fq '@[@"bundleId", @"applicationIdentifier", @"bundleIdentifier"]' AppsMusicFix.m
          grep -Fq 'bash scripts/patch-byetunes-embedded.sh' Makefile
          bash -n scripts/patch-byetunes-embedded.sh

          git add AppsMusicFix.m Makefile scripts/patch-byetunes-embedded.sh
          git diff --cached --check
          git diff --cached
          git commit -m 'Fix iOS 27 app identifiers and defer embedded ByeTunes FFI startup'
          git push origin HEAD:fix-ios27-app-access-byetunes-startup-20260812
