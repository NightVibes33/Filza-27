name: Verify Filza 27 arm64 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: diagnose-filza-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      WOLFSSH_COMMIT: e7c8dc2c2c54e5f0f2986be592e2243725a4dd33
      WOLFSSL_COMMIT: 9ab8a4b19debdade06b10d30cf70167de8f9b915
      NFCARD_PIN: 4dbacf6b503d861dba605286f9ee6f7904c8a81f
      AIRCARD_PIN: 097a058c984ffc33ccb697b9dfe8058be3e86244
      NFCARD_CACHE_SCHEMA: v1
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Verify idevice pairing-host API
        shell: bash
        run: |
          set -euxo pipefail
          test -s "$GITHUB_WORKSPACE/Vendor/idevice/lib/libidevice_ffi.a"
          test -s "$GITHUB_WORKSPACE/Vendor/idevice/include/idevice.h"
          grep -Fq 'pairable_host_accept' "$GITHUB_WORKSPACE/Vendor/idevice/include/idevice.h"
          grep -Fq 'rp_pairing_file_write' "$GITHUB_WORKSPACE/Vendor/idevice/include/idevice.h"

      - name: Restore pinned SSH stack cache
        id: ssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/ssh
          key: ssh-stack-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}-${{ hashFiles('scripts/build-ssh-stack.sh') }}

      - name: Build pinned SSH stack
        if: steps.ssh-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"

      - name: Restore pinned wolfSSH server cache
        id: wolfssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/wolfssh
          key: wolfssh-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios17-${{ env.WOLFSSH_COMMIT }}-${{ env.WOLFSSL_COMMIT }}-${{ hashFiles('scripts/build-wolfssh-stack.sh', 'scripts/wolfssh-allow-multiple-session-channels.patch') }}

      - name: Build pinned wolfSSH server stack
        if: steps.wolfssh-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-wolfssh-stack.sh "$GITHUB_WORKSPACE/Vendor/wolfssh"
          test "$(cat Vendor/wolfssh/WOLFSSH_COMMIT)" = "$WOLFSSH_COMMIT"
          test "$(cat Vendor/wolfssh/WOLFSSL_COMMIT)" = "$WOLFSSL_COMMIT"
          test -s Vendor/wolfssh/include/wolfssh/ssh.h
          test -s Vendor/wolfssh/include/wolfssh/wolfsftp.h
          test -s Vendor/wolfssh/include/wolfssl/wolfcrypt/ecc.h
          test -s Vendor/wolfssh/lib/libwolfssh.a
          test -s Vendor/wolfssh/lib/libwolfssl.a

      - name: Restore staged NFCARD + AirliftFFI cache
        id: nfcard-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ThirdParty/NFCARD/ios-app
            ThirdParty/NFCARD/AirliftFFI
            ThirdParty/NFCARD/NFCARD_PINNED_REVISION
            ThirdParty/NFCARD/AIRCARD_PINNED_REVISION
          key: nfcard-runtime-${{ env.NFCARD_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios17-${{ env.NFCARD_PIN }}-${{ env.AIRCARD_PIN }}-${{ hashFiles('scripts/stage-nfcard.sh', 'scripts/build-nfcard-ffi.sh') }}

      - name: Build staged NFCARD + AirliftFFI cache
        if: steps.nfcard-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/stage-nfcard.sh
          bash scripts/build-nfcard-ffi.sh "$GITHUB_WORKSPACE/ThirdParty/NFCARD" "$GITHUB_WORKSPACE/ThirdParty/NFCARD/AirliftFFI"

      - name: Verify staged NFCARD + AirliftFFI cache
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat ThirdParty/NFCARD/NFCARD_PINNED_REVISION)" = "$NFCARD_PIN"
          test "$(cat ThirdParty/NFCARD/AIRCARD_PINNED_REVISION)" = "$AIRCARD_PIN"
          test -s ThirdParty/NFCARD/ios-app/NFCARDContentView.swift
          test -s ThirdParty/NFCARD/ios-app/AppViewModel.swift
          test -s ThirdParty/NFCARD/AirliftFFI/lib/libairlift_ffi.a
          test -s ThirdParty/NFCARD/AirliftFFI/include/AirliftFFI/airlift.h
          grep -Fq 'al_pairing_run_host' ThirdParty/NFCARD/AirliftFFI/include/AirliftFFI/airlift.h
          grep -Fq 'al_connection_endpoint_set' ThirdParty/NFCARD/AirliftFFI/include/AirliftFFI/airlift.h
          grep -Fq 'al_syslog_stream_start' ThirdParty/NFCARD/AirliftFFI/include/AirliftFFI/airlift.h

      - name: Save staged NFCARD + AirliftFFI cache
        if: steps.nfcard-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ThirdParty/NFCARD/ios-app
            ThirdParty/NFCARD/AirliftFFI
            ThirdParty/NFCARD/NFCARD_PINNED_REVISION
            ThirdParty/NFCARD/AIRCARD_PINNED_REVISION
          key: ${{ steps.nfcard-runtime-cache.outputs.cache-primary-key }}

      - name: Verify NFCARD integration pins
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq '4dbacf6b503d861dba605286f9ee6f7904c8a81f' scripts/stage-nfcard.sh
          grep -Fq '097a058c984ffc33ccb697b9dfe8058be3e86244' scripts/stage-nfcard.sh
          grep -Fq 'FilzaNFCARDHost.swift' Makefile
          grep -Fq 'FilzaNFCARDBridge.m' Makefile
          grep -Fq 'libairlift_ffi.a' Makefile
          grep -Fq 'controller.isModalInPresentation = true' ThirdParty/3105/Sources/FilzaEmbeddedPanel.swift
          grep -Fq 'DragGesture(minimumDistance: 12' ThirdParty/3105/Sources/FilzaEmbeddedPanel.swift

      - name: Capture complete Theos build
        id: full-build
        shell: bash
        run: |
          set +e
          export PATH="/opt/procursus/bin:$PATH"
          mkdir -p .theos
          gmake clean >/dev/null 2>&1 || true
          set -o pipefail
          # Mond 2.0 upstream uses iOS 17 APIs. This is a compiler/deployment
          # target only; it does not change Filza's CFBundle app version.
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:17.0 2>&1 | tee .theos/full-build.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "===== FAILURE/SUCCESS TAIL ====="
          tail -n 400 .theos/full-build.log || true
          exit "$rc"

      - name: Verify compiled runtime
        shell: bash
        run: |
          set -euxo pipefail
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          test "$(cat Vendor/wolfssh/WOLFSSH_COMMIT)" = "$WOLFSSH_COMMIT"
          test "$(cat Vendor/wolfssh/WOLFSSL_COMMIT)" = "$WOLFSSL_COMMIT"
          test -s Vendor/wolfssh/lib/libwolfssh.a
          test -s Vendor/wolfssh/lib/libwolfssl.a
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'wolfSSH SSH/SFTP server listening address=' "$DYLIB"
          grep -aFq 'https://itunes.apple.com/search' "$DYLIB"
          grep -aFq 'https://api.deezer.com/search' "$DYLIB"
          grep -aFq 'https://lrclib.net/api/get' "$DYLIB"
          grep -aFq 'https://lrclib.net/api/search' "$DYLIB"
          grep -aFq 'https://raw.githubusercontent.com/amll-dev/amll-ttml-db/refs/heads/main/am-lyrics' "$DYLIB"
          grep -aFq 'itunes:timing="Line"' "$DYLIB"
          grep -aFq '[ByeTunesRichLyrics] AMLL TTML hit appleMusicId=' "$DYLIB"
          grep -aFq 'Lyrics Provider' "$DYLIB"
          ! grep -aFq 'Apple Music Subscription Lyrics' "$DYLIB"
          ! grep -aFq 'appleSubscriptionLyrics' "$DYLIB"
          ! grep -aFq 'media-user-token' "$DYLIB"
          ! grep -aFq 'syllable-lyrics' "$DYLIB"
          grep -aFq 'Pair with ByeTunes' "$DYLIB"
          grep -aFq 'RPPairing tunnel established via' "$DYLIB"
          grep -aFq '10.7.0.1' "$DYLIB"
          ! grep -aFq 'LocalDevVPN preflight reachable hosts=' "$DYLIB"
          ! grep -aFq 'filzaByeTunesLastRPPairingHost' "$DYLIB"
          grep -aFq 'NFCARDEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'Pair with NFCARD' "$DYLIB"
          grep -aFq 'cardmaker-omega.vercel.app' "$DYLIB"
          grep -aFq 'Apps/Music/Gestalt/NFCARD' "$DYLIB"
          ! grep -aFq 'AirCardEmbeddedHostFactory' "$DYLIB"
          ! grep -aFq '127.0.0.1:41337' "$DYLIB"
          ! grep -aFq 'ByeTunesYoink.bundle' "$DYLIB"
          ! grep -aFq 'NodeMobile' "$DYLIB"
          ! grep -aFq '/api/metadata' "$DYLIB"
          ! grep -aFq '/api/download' "$DYLIB"
          ! grep -aFq 'ByeTunesApiUrl' "$DYLIB"

      - name: Stage release resources
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources
          test -s .theos/byetunes-resources/AppIconImage.png
          test -s .theos/byetunes-resources/ByeTunes-Info.plist
          test ! -e .theos/byetunes-resources/Config.plist
          test -s ThirdParty/mond-current/Resources/MondEmbedded.bundle/Info.plist
          test -s ThirdParty/3105/Resources/Filza3105.bundle/UpstreamAppInfo.plist

      - name: Download base Filza IPA
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 "$BASE_IPA_URL" -o .theos/FilzaSlop-base-unsigned.ipa
          echo "$BASE_IPA_SHA256  .theos/FilzaSlop-base-unsigned.ipa" | shasum -a 256 -c -

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d /tmp/filza-modern-ipa.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          unzip -q .theos/FilzaSlop-base-unsigned.ipa -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          test -s "$APP/$EXECUTABLE"

          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          codesign --remove-signature "$APP/Frameworks/FilzaApplySandboxExt.dylib" >/dev/null 2>&1 || true
          rm -f "$APP/Frameworks/FilzaMondModern.dylib"

          cp .theos/byetunes-resources/AppIconImage.png "$APP/AppIconImage.png"
          cp .theos/byetunes-resources/ByeTunes-Info.plist "$APP/ByeTunes-Info.plist"
          rm -f "$APP/Config.plist"

          rm -rf "$APP/MondEmbedded.bundle" "$APP/Filza3105.bundle"
          cp -R ThirdParty/mond-current/Resources/MondEmbedded.bundle "$APP/MondEmbedded.bundle"
          cp -R ThirdParty/3105/Resources/Filza3105.bundle "$APP/Filza3105.bundle"

          plutil -replace MinimumOSVersion -string "17.0" "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$APP/Info.plist"
          plutil -replace UIFileSharingEnabled -bool YES "$APP/Info.plist"
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool YES "$APP/Info.plist"
          plutil -replace NSLocalNetworkUsageDescription -string "Filza 27 uses your local network for WebDAV, SSH/SFTP, LocalDevVPN Remote Pairing, ByeTunes pairing, and NFCARD." "$APP/Info.plist"
          plutil -replace NSBonjourServices -json '["_http._tcp","_ssh._tcp","_remotepairing._tcp","_remotepairing-pairable-host._tcp","_aircardprobe._tcp"]' "$APP/Info.plist"
          plutil -replace NSPhotoLibraryUsageDescription -string "Filza 27 NFCARD needs photo access so you can choose artwork for Wallet cards." "$APP/Info.plist"
          plutil -remove UIBackgroundModes "$APP/Info.plist" 2>/dev/null || true
          plutil -insert UIBackgroundModes -json '["audio"]' "$APP/Info.plist"
          plutil -remove WKAppBoundDomains "$APP/Info.plist" 2>/dev/null || true
          plutil -insert WKAppBoundDomains -json '["cardmaker-omega.vercel.app"]' "$APP/Info.plist"
          plutil -remove UIApplicationShortcutItems "$APP/Info.plist" 2>/dev/null || true
          plutil -insert UIApplicationShortcutItems -json '[
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.apps-manager","UIApplicationShortcutItemTitle":"Apps Manager","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeFavorite"},
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.music-library","UIApplicationShortcutItemTitle":"Music","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeAudio"},
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.gestalt-manager","UIApplicationShortcutItemTitle":"Gestalt","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeTask"},
            {"UIApplicationShortcutItemType":"com.nightvibes33.filzaslop.nfcard","UIApplicationShortcutItemTitle":"NFCARD","UIApplicationShortcutItemIconType":"UIApplicationShortcutIconTypeShare"}
          ]' "$APP/Info.plist"
          bash scripts/merge-3105-app-metadata.sh "$APP/Info.plist"
          plutil -remove CFBundleURLTypes "$APP/Info.plist" 2>/dev/null || true

          test "$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")" = "17.0"
          test ! -e "$APP/Config.plist"
          test ! -e "$APP/Frameworks/FilzaMondModern.dylib"
          test -s "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          test -s "$APP/MondEmbedded.bundle/Info.plist"
          test -s "$APP/Filza3105.bundle/UpstreamAppInfo.plist"

          for forbidden in '/api/metadata' '/api/download' 'ByeTunesApiUrl'; do
            ! LC_ALL=C grep -aFq "$forbidden" "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          done

          OUTPUT="$GITHUB_WORKSPACE/.theos/Filza-27-modern-${GITHUB_SHA::7}-unsigned.ipa"
          rm -f "$OUTPUT"
          (cd "$STAGE" && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -tq "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          ! unzip -l "$OUTPUT" | grep -E 'Payload/[^/]+\.app/Config\.plist$'
          BONJOUR_JSON="$(plutil -extract NSBonjourServices json -o - "$APP/Info.plist")"
          [[ "$BONJOUR_JSON" == *'"_remotepairing._tcp"'* ]]
          [[ "$BONJOUR_JSON" == *'"_remotepairing-pairable-host._tcp"'* ]]
          [[ "$BONJOUR_JSON" == *'"_aircardprobe._tcp"'* ]]
          [[ "$(plutil -extract UIBackgroundModes json -o - "$APP/Info.plist")" == *'"audio"'* ]]
          [[ "$(plutil -extract WKAppBoundDomains json -o - "$APP/Info.plist")" == *'"cardmaker-omega.vercel.app"'* ]]
          SHORTCUTS_JSON="$(plutil -extract UIApplicationShortcutItems json -o - "$APP/Info.plist")"
          [[ "$SHORTCUTS_JSON" == *'apps-manager'* ]]
          [[ "$SHORTCUTS_JSON" == *'music-library'* ]]
          [[ "$SHORTCUTS_JSON" == *'gestalt-manager'* ]]
          [[ "$SHORTCUTS_JSON" == *'nfcard'* ]]
          [[ "$SHORTCUTS_JSON" != *'"patches"'* ]]
          [[ "$SHORTCUTS_JSON" != *'"aircard"'* ]]
          shasum -a 256 "$OUTPUT" | tee .theos/IPA-SHA256.txt

      - name: Upload modern unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Filza-27-modern-unsigned-arm64
          path: |
            .theos/Filza-27-modern-*-unsigned.ipa
            .theos/IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filza-full-build-log-${{ github.run_id }}
          path: .theos/full-build.log
          if-no-files-found: warn
          retention-days: 7
