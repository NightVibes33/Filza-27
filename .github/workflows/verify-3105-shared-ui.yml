name: Verify 3105 1.1.1 + Shared Embedded UI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: verify-3105-shared-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: macos-26-intel
    steps:
      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned 3105 1.1.1 integration
        shell: bash
        run: |
          set -euxo pipefail
          test -f scripts/stage-3105-v1.sh
          grep -Fq 'UPSTREAM_OWNER="YangJiiii"' scripts/stage-3105-v1.sh
          grep -Fq 'UPSTREAM_COMMIT="f1b81047a01a1817c7fb17e6938929eef108f1aa"' scripts/stage-3105-v1.sh
          grep -Fq 'UPSTREAM_VERSION="1.1.1"' scripts/stage-3105-v1.sh
          test -f ThirdParty/3105/Sources/AppState.swift
          test -f ThirdParty/3105/Sources/KernelExploit.swift
          test -f ThirdParty/3105/Sources/Utils.swift
          grep -Fq 'stage-3105-v1.sh' Makefile

      - name: Verify embedded-host isolation
        shell: bash
        run: |
          set -euxo pipefail
          test -f scripts/patch-3105-embedded-compat.sh
          grep -Fq 'patch-3105-embedded-compat.sh' Makefile
          bash scripts/stage-3105-v1.sh
          bash scripts/patch-3105-embedded-compat.sh
          ! grep -Fq 'enum AppUpdateChecker' ThirdParty/3105/Sources/Utils.swift
          ! grep -Fq 'DisplayIdentityAttestationToken' ThirdParty/3105/Sources/Utils.swift
          grep -Fq 'enum ExploitStatus' ThirdParty/3105/Sources/Utils.swift
          grep -Fq 'enum AppPaths' ThirdParty/3105/Sources/Utils.swift

      - name: Verify shared presentation and modern Mond core
        shell: bash
        run: |
          set -euxo pipefail
          PANEL='ThirdParty/3105/Sources/FilzaEmbeddedPanel.swift'
          test -f "$PANEL"
          grep -Fq 'struct FilzaEmbeddedPanel<Content: View>' "$PANEL"
          grep -Fq 'Label("Close", systemImage: "xmark")' "$PANEL"
          grep -Fq 'controller.modalPresentationStyle = .pageSheet' "$PANEL"
          grep -Fq 'sheet.detents = [.large()]' "$PANEL"
          grep -Fq 'sheet.prefersGrabberVisible = true' "$PANEL"
          grep -Fq 'FilzaEmbeddedPanel {' Filza3105Host.swift
          grep -Fq 'FilzaEmbeddedPanel {' ByeTunesEmbeddedHost.swift
          grep -Fq 'FilzaEmbeddedPanel {' FilzaMondCurrentHost.swift
          ! test -d MondModern
          ! test -e scripts/prepare-ios16-compat.sh
          ! test -e scripts/patch-mond-ios16-backport.sh
          ! grep -Fq 'FilzaMondModern.dylib' FilzaMondBridge.m
          ! grep -Fq 'dlopen' FilzaMondBridge.m
          grep -Fq 'MondEmbeddedHostFactory' FilzaMondBridge.m
          ! grep -Fq 'ios16Backport' FilzaMondCurrentHost.swift

      - name: Verify embedding boundaries
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -Fq 'ThreeOneOSFive/App.swift' Makefile
          ! grep -Fq 'OnboardingView.swift' Makefile
          ! grep -Fq 'DisplayIdentityAttribution.swift' Makefile
          ! grep -Fq 'AntiDetection.m' Makefile
          grep -Fq 'return makeMusicLibraryHost()' ByeTunesEmbeddedHost.swift
          grep -Fq 'return makePresentedMusicLibraryHost()' ByeTunesEmbeddedHost.swift
