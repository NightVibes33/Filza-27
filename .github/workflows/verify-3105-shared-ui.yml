name: Verify 3105 2.0 + Shared Embedded UI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: verify-3105-shared-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: macos-26-intel
    steps:
      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pristine upstream and Filza integration contracts
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/verify-3105-pristine-integration.sh
          test "$(cat ThirdParty/3105/UPSTREAM_PIN)" = "4a15d823b711bc0639de1f3fd2c764b5982d9245"
          test -f ThirdParty/3105/UpstreamRepo/ThreeOneOSFive/ContentView.swift
          test -f ThirdParty/3105/UpstreamRepo/ThreeOneOSFive/helpers/PackageRepositoryStore.swift
          test -f ThirdParty/3105/Sources/PackageRepositoryStore.swift
          grep -Fq 'RepositoryHomeView' ThirdParty/3105/Sources/ThreeOneOSFiveContentView.swift
          grep -Fq 'return developerModeEnabled' ThirdParty/3105/Sources/AppTabNavigationState.swift
          grep -Fq 'FeatureVisibility(developerModeEnabled: developerModeActive || forceFilesVisible)' ThirdParty/3105/Sources/ThreeOneOSFiveContentView.swift
          ! grep -Fq '.tabViewStyle(.page' ThirdParty/3105/Sources/ThreeOneOSFiveContentView.swift
          ! grep -Fq 'minimumScaleFactor(0.62)' ThirdParty/3105/Sources/ThreeOneOSFiveContentView.swift

      - name: Verify semantic Filza routes and custom integrations
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq '@StateObject private var patchStore = PatchProjectStore()' Filza3105Host.swift
          grep -Fq '@StateObject private var repositoryStore = PackageRepositoryStore()' Filza3105Host.swift
          grep -Fq '.environmentObject(patchStore)' Filza3105Host.swift
          grep -Fq '.environmentObject(repositoryStore)' Filza3105Host.swift
          grep -Fq 'initialTab: AppSection.home.rawValue' Filza3105Host.swift
          grep -Fq 'initialTab: AppSection.files.rawValue' Filza3105Host.swift
          grep -Fq 'initialTab: AppSection.installed.rawValue' Filza3105Host.swift
          grep -Fq 'Filza3105PairingSettingsSection()' ThirdParty/3105/Sources/ThreeOneOSFiveSettingsView.swift
          grep -Fq 'FilzaSharedPairingSupport.enhancedIcon' ThirdParty/3105/Sources/AppDataBrowserView.swift
          grep -Fq 'FILZA_3105_APP_VIEW_SORT_V2' ThirdParty/3105/Sources/AppDataBrowserView.swift
          grep -Fq 'Repackage as IPA' ThirdParty/3105/Sources/AppDataBrowserView.swift
          grep -Fq 'allowedContentTypes: [.item]' ThirdParty/3105/Sources/FilzaSharedPairingSupport.swift

      - name: Verify shared presentation and embedding boundaries
        shell: bash
        run: |
          set -euxo pipefail
          PANEL='ThirdParty/3105/Sources/FilzaEmbeddedPanel.swift'
          test -f "$PANEL"
          grep -Fq 'struct FilzaEmbeddedPanel<Content: View>' "$PANEL"
          grep -Fq 'Label("Close", systemImage: "xmark")' "$PANEL"
          grep -Fq 'controller.modalPresentationStyle = .pageSheet' "$PANEL"
          grep -Fq 'sheet.detents = [.large()]' "$PANEL"
          grep -Fq 'sheet.prefersGrabberVisible = true' "$PANEL"
          grep -Fq 'FilzaEmbeddedPanel {' Filza3105Host.swift
          ! grep -Fq 'ThreeOneOSFive/App.swift' Makefile
          ! grep -Fq 'AntiDetection.m' Makefile
          test -f ThirdParty/3105/Resources/Filza3105.bundle/UpstreamAppInfo.plist
          test "$(plutil -extract CFBundleShortVersionString raw -o - ThirdParty/3105/Resources/Filza3105.bundle/UpstreamAppInfo.plist)" = "2.0"
