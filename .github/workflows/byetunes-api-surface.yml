name: Probe ByeTunes API Surface

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/aircard-main-sync
    paths:
      - .github/workflows/byetunes-api-surface.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public API surface
        shell: bash
        run: |
          set -u
          HOST="api.byetunes.xyz"
          BASE="https://$HOST"
          OUT="$GITHUB_WORKSPACE/byetunes-api-probe"
          mkdir -p "$OUT"

          {
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "runner=$(uname -a)"
            echo
            echo "=== DNS A ==="
            dig +short A "$HOST" || true
            echo "=== DNS AAAA ==="
            dig +short AAAA "$HOST" || true
            echo "=== DNS CNAME ==="
            dig +short CNAME "$HOST" || true
            echo "=== DNS trace-ish ==="
            nslookup "$HOST" || true
          } > "$OUT/network.txt" 2>&1

          {
            echo "=== TLS certificate ==="
            timeout 15 openssl s_client -connect "$HOST:443" -servername "$HOST" </dev/null 2>/dev/null |
              openssl x509 -noout -subject -issuer -serial -dates -ext subjectAltName 2>&1 || true
          } > "$OUT/tls.txt"

          paths=(
            "/"
            "/robots.txt"
            "/sitemap.xml"
            "/openapi.json"
            "/swagger.json"
            "/docs"
            "/api"
            "/api/"
            "/api/download"
            "/package.json"
            "/server.js"
            "/app.js"
            "/index.js"
          )

          printf "path\tstatus\tcontent_type\tbytes\tredirect\n" > "$OUT/summary.tsv"

          for path in "${paths[@]}"; do
            safe=$(printf "%s" "$path" | sed 's#^/##; s#[^A-Za-z0-9._-]#_#g')
            [ -n "$safe" ] || safe="root"
            headers="$OUT/${safe}.headers.txt"
            body="$OUT/${safe}.body.txt"

            meta=$(curl -sS -L --max-redirs 3               --connect-timeout 10 --max-time 30               --max-filesize 1048576               -A "Filza27-ByeTunes-Public-Surface-Probe/1.0"               -D "$headers" -o "$body"               -w "%{http_code}\t%{content_type}\t%{size_download}\t%{url_effective}"               "$BASE$path" 2>>"$OUT/curl-errors.txt" || true)

            printf "%s\t%s\n" "$path" "$meta" >> "$OUT/summary.tsv"

            # Redact obvious credential-shaped material before artifact upload.
            if [ -f "$body" ]; then
              python3 - "$body" <<'PY'
import re, sys
p=sys.argv[1]
try:
    data=open(p,'r',encoding='utf-8',errors='replace').read()
except Exception:
    raise SystemExit
patterns = [
    (r'(?i)(authorization\s*[:=]\s*)([^\s"\'<>]+)', r'\1[REDACTED]'),
    (r'(?i)((?:api[_-]?key|secret|token|password|passwd)\s*["\']?\s*[:=]\s*["\']?)([^"\'\s,}]+)', r'\1[REDACTED]'),
]
for pat,repl in patterns:
    data=re.sub(pat,repl,data)
open(p,'w',encoding='utf-8').write(data)
PY
            fi
          done

          {
            echo "=== OPTIONS /api/download ==="
            curl -sS -i -X OPTIONS               --connect-timeout 10 --max-time 30               -A "Filza27-ByeTunes-Public-Surface-Probe/1.0"               "$BASE/api/download" || true
            echo
            echo "=== HEAD /api/download ==="
            curl -sS -I               --connect-timeout 10 --max-time 30               -A "Filza27-ByeTunes-Public-Surface-Probe/1.0"               "$BASE/api/download" || true
          } > "$OUT/api-download-methods.txt" 2>&1

          echo "===== SUMMARY ====="
          cat "$OUT/summary.tsv"
          echo
          echo "===== NETWORK ====="
          cat "$OUT/network.txt"
          echo
          echo "===== TLS ====="
          cat "$OUT/tls.txt"

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: byetunes-api-public-surface
          path: byetunes-api-probe/
          if-no-files-found: error
          retention-days: 3
