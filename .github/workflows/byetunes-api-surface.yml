name: Probe ByeTunes API Surface

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/aircard-main-sync
    paths:
      - .github/workflows/byetunes-api-surface.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public API surface
        shell: bash
        run: |
          set -u
          HOST="api.byetunes.xyz"
          BASE="https://$HOST"
          OUT="$GITHUB_WORKSPACE/byetunes-api-probe"
          mkdir -p "$OUT"

          {
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "runner=$(uname -a)"
            echo
            echo "=== DNS A ==="
            dig +short A "$HOST" || true
            echo "=== DNS AAAA ==="
            dig +short AAAA "$HOST" || true
            echo "=== DNS CNAME ==="
            dig +short CNAME "$HOST" || true
            echo "=== nslookup ==="
            nslookup "$HOST" || true
          } > "$OUT/network.txt" 2>&1

          {
            echo "=== TLS certificate ==="
            timeout 15 openssl s_client -connect "$HOST:443" -servername "$HOST" </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -serial -dates -ext subjectAltName 2>&1 || true
          } > "$OUT/tls.txt"

          paths=(
            "/"
            "/robots.txt"
            "/sitemap.xml"
            "/openapi.json"
            "/swagger.json"
            "/docs"
            "/api"
            "/api/"
            "/api/download"
            "/package.json"
            "/server.js"
            "/app.js"
            "/index.js"
          )

          printf "path\tstatus\tcontent_type\tbytes\tredirect\n" > "$OUT/summary.tsv"

          for path in "${paths[@]}"; do
            safe=$(printf "%s" "$path" | sed 's#^/##; s#[^A-Za-z0-9._-]#_#g')
            [ -n "$safe" ] || safe="root"
            headers="$OUT/${safe}.headers.txt"
            body="$OUT/${safe}.body.txt"

            meta=$(curl -sS -L --max-redirs 3 --connect-timeout 10 --max-time 30 --max-filesize 1048576 -A "Filza27-ByeTunes-Public-Surface-Probe/1.0" -D "$headers" -o "$body" -w "%{http_code}\t%{content_type}\t%{size_download}\t%{url_effective}" "$BASE$path" 2>>"$OUT/curl-errors.txt" || true)
            printf "%s\t%s\n" "$path" "$meta" >> "$OUT/summary.tsv"

            if [ -f "$body" ]; then
              python3 -c 'import re,sys; p=sys.argv[1]; d=open(p,"r",encoding="utf-8",errors="replace").read(); d=re.sub(r"(?i)(authorization[[:space:]]*[:=][[:space:]]*)[^[:space:]\"<>]+",r"\\1[REDACTED]",d); d=re.sub(r"(?i)((api[_-]?key|secret|token|password|passwd)[[:space:]]*[\"\x27]?[[:space:]]*[:=][[:space:]]*[\"\x27]?)[^\"\x27[:space:],}]+",r"\\1[REDACTED]",d); open(p,"w",encoding="utf-8").write(d)' "$body" || true
            fi
          done

          {
            echo "=== POST contract: missing URL /api/download ==="
            curl -sS -i --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' \
              --data '{}' "$BASE/api/download" || true
            echo
            echo "=== POST contract: unsupported URL /api/download ==="
            curl -sS -i --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' \
              --data '{"url":"https://example.com/not-a-track","format":"mp3","genreSource":"itunes","syncedLyrics":false}' \
              "$BASE/api/download" || true
            echo
            echo "=== POST contract: nonexistent Deezer URL /api/download ==="
            curl -sS -i --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' \
              --data '{"url":"https://www.deezer.com/track/0","format":"mp3","genreSource":"itunes","syncedLyrics":false}' \
              "$BASE/api/download" || true
            echo
            echo "=== POST contract: missing URL /api/metadata ==="
            curl -sS -i --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' \
              --data '{}' "$BASE/api/metadata" || true
            echo
            echo "=== POST contract: nonexistent Deezer URL /api/metadata ==="
            curl -sS -i --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' \
              --data '{"url":"https://www.deezer.com/track/0"}' "$BASE/api/metadata" || true
          } > "$OUT/post-contracts.txt" 2>&1

          {
            echo "=== OPTIONS /api/download ==="
            curl -sS -i -X OPTIONS --connect-timeout 10 --max-time 30 -A "Filza27-ByeTunes-Public-Surface-Probe/1.0" "$BASE/api/download" || true
            echo
            echo "=== HEAD /api/download ==="
            curl -sS -I --connect-timeout 10 --max-time 30 -A "Filza27-ByeTunes-Public-Surface-Probe/1.0" "$BASE/api/download" || true
          } > "$OUT/api-download-methods.txt" 2>&1

          echo "===== SUMMARY ====="
          cat "$OUT/summary.tsv"
          echo
          echo "===== NETWORK ====="
          cat "$OUT/network.txt"
          echo
          echo "===== TLS ====="
          cat "$OUT/tls.txt"
          echo
          echo "===== POST CONTRACTS ====="
          cat "$OUT/post-contracts.txt"

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: byetunes-api-public-surface
          path: byetunes-api-probe/
          if-no-files-found: error
          retention-days: 3
