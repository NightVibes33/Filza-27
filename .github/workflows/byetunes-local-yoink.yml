name: Verify Local Yoink ByeTunes API

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/aircard-main-sync
    paths:
      - "ByeTunesLocal/**"
      - "scripts/prepare-byetunes-local-yoink.sh"
      - "scripts/apply-byetunes-local-yoink-patch.py"
      - "scripts/test-byetunes-local-contract.sh"
      - "scripts/stage-byetunes-node-mobile.sh"
      - ".github/workflows/byetunes-local-yoink.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Filza temp branch
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage pinned NodeMobile iOS runtime
        run: |
          bash scripts/stage-byetunes-node-mobile.sh "$RUNNER_TEMP/NodeMobile"
          test -s "$RUNNER_TEMP/NodeMobile/NodeMobile.framework/NodeMobile"
          test -s "$RUNNER_TEMP/NodeMobile/NodeMobile.framework/Headers/NodeMobile.h"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.29.1"
          run_install: false

      - name: Prepare pinned patched Yoink
        run: |
          bash scripts/prepare-byetunes-local-yoink.sh "$RUNNER_TEMP/yoink"
          git -C "$RUNNER_TEMP/yoink" diff --stat
          git -C "$RUNNER_TEMP/yoink" diff > "$RUNNER_TEMP/yoink-direct-deezer.diff"

      - name: Install Yoink dependencies
        working-directory: ${{ runner.temp }}/yoink
        run: pnpm install --frozen-lockfile

      - name: Run Yoink unit tests
        working-directory: ${{ runner.temp }}/yoink
        run: pnpm run test:unit

      - name: Build patched Yoink
        working-directory: ${{ runner.temp }}/yoink
        run: pnpm build

      - name: Start patched Yoink
        working-directory: ${{ runner.temp }}/yoink
        run: |
          nohup pnpm start > "$RUNNER_TEMP/yoink-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/yoink-server.pid"
          for i in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/yoink-server.log"
          exit 1

      - name: Compare controlled API contracts against Edu deployment
        run: |
          bash scripts/test-byetunes-local-contract.sh             http://127.0.0.1:3000             https://api.byetunes.xyz             "$RUNNER_TEMP/byetunes-local-contract"

      - name: Save verification evidence
        if: always()
        run: |
          mkdir -p byetunes-local-verification
          cp -f "$RUNNER_TEMP/yoink-direct-deezer.diff" byetunes-local-verification/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP/yoink-server.log" byetunes-local-verification/ 2>/dev/null || true
          if [ -d "$RUNNER_TEMP/byetunes-local-contract" ]; then
            cp -R "$RUNNER_TEMP/byetunes-local-contract/." byetunes-local-verification/
          fi
          {
            echo "yoink_commit=061e33ffc8d5050f828196bb78f7034f817e1e2e"
            echo "filza_commit=$GITHUB_SHA"
            date -u +"verified_at=%Y-%m-%dT%H:%M:%SZ"
          } > byetunes-local-verification/provenance.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byetunes-local-yoink-verification
          path: byetunes-local-verification/
          if-no-files-found: error
          retention-days: 7
