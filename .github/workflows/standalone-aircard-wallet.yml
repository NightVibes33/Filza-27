name: Verify NFCARD IPA

on:
  push:
    branches:
      - temp/aircard-wallet-standalone
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfcard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout temp branch
        uses: actions/checkout@v4

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Restore patched AirliftFFI cache
        uses: actions/cache@v4
        with:
          path: .theos/aircard-ffi-cache
          key: aircard-ffi-macos26-xcode26.2-097a058-rp-v1
          restore-keys: |
            aircard-ffi-macos26-xcode26.2-097a058-

      - name: Build NFCARD IPA
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .theos
          bash scripts/build-standalone-aircard-wallet-v2.sh 2>&1 | tee .theos/nfcard-build.log

      - name: Verify standalone contract
        shell: bash
        run: |
          set -euxo pipefail
          IPA=.theos/NFCARD-unsigned.ipa
          test -s "$IPA"
          unzip -tq "$IPA"
          test -s .theos/NFCARD-SHA256.txt
          grep -Fq '097a058c984ffc33ccb697b9dfe8058be3e86244' scripts/build-standalone-aircard-wallet-v2.sh
          grep -Fq 'NFCARDPairingTab()' scripts/patch-standalone-aircard-wallet.py
          grep -Fq 'NFCARDWalletCardsTab()' scripts/patch-standalone-aircard-wallet.py
          grep -Fq 'AirCardLibraryView(onExit:' scripts/patch-standalone-aircard-wallet.py
          grep -Fq 'setCardStudioVisible(true)' scripts/patch-standalone-aircard-wallet.py
          grep -Fq '.opacity(showCardStudio ? 1 : 0)' scripts/patch-standalone-aircard-wallet.py
          ! grep -Fq 'if showCardStudio {' scripts/patch-standalone-aircard-wallet.py
          ! grep -Fq 'fullScreenCover' scripts/patch-standalone-aircard-wallet.py
          grep -Fq '! grep -Fq '\''Choose Pairing File from Files…' scripts/build-standalone-aircard-wallet-v2.sh
          ! grep -Fq 'scripts/patch-aircard-embedded-parity.py' scripts/build-standalone-aircard-wallet-v2.sh
          du -h "$IPA"
          cat .theos/NFCARD-SHA256.txt

      - name: Upload unsigned NFCARD IPA
        uses: actions/upload-artifact@v4
        with:
          name: NFCARD-unsigned
          path: |
            .theos/NFCARD-unsigned.ipa
            .theos/NFCARD-SHA256.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFCARD-build-log-${{ github.run_id }}
          path: .theos/nfcard-build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
