name: Apply iOS app icon format-10 fallback

on:
  push:
    branches:
      - fix-ios27-app-icons-format10-20260813
    paths:
      - .github/workflows/icon-format10-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ios27-app-icons-format10-20260813
          fetch-depth: 0

      - name: Add public format-10 icon fallback
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AppProxyMetadataFix.m')
          s = p.read_text()
          old = '''    CGFloat scale = UIScreen.mainScreen.scale ?: 2.0;
              for (NSInteger format = 2; format >= 0; format--) {
                  UIImage *image = nil;
                  @try {
                      image = ((id (*)(id, SEL, id, NSInteger, CGFloat))objc_msgSend)(
                          UIImage.class, selector, identifier, format, scale);
                  } @catch (__unused NSException *exception) {
                      image = nil;
                  }
                  if (![image isKindOfClass:UIImage.class]) continue;
                  NSData *png = UIImagePNGRepresentation(image);
                  if (png.length > 0) {
                      NSLog(@"[AppProxyMetadataFix] icon fallback id=%@ variant=%lu format=%ld",
                            identifier, (unsigned long)variant, (long)format);
                      return png;
                  }
              }
          '''
          new = '''    CGFloat scale = UIScreen.mainScreen.scale ?: 2.0;
              // Public jailbreak/bootstrap implementations use MobileIcons format 10
              // for installed application icons. Try that first, then retain the
              // existing compact formats as fallbacks.
              const NSInteger formats[] = {10, 2, 1, 0};
              for (NSUInteger index = 0; index < sizeof(formats) / sizeof(formats[0]); index++) {
                  NSInteger format = formats[index];
                  UIImage *image = nil;
                  @try {
                      image = ((id (*)(id, SEL, id, NSInteger, CGFloat))objc_msgSend)(
                          UIImage.class, selector, identifier, format, scale);
                  } @catch (__unused NSException *exception) {
                      image = nil;
                  }
                  if (![image isKindOfClass:UIImage.class]) continue;
                  NSData *png = UIImagePNGRepresentation(image);
                  if (png.length > 0) {
                      NSLog(@"[AppProxyMetadataFix] icon fallback id=%@ variant=%lu format=%ld",
                            identifier, (unsigned long)variant, (long)format);
                      return png;
                  }
              }
          '''
          if old not in s:
              raise SystemExit('expected icon fallback loop not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -Fq 'const NSInteger formats[] = {10, 2, 1, 0};' AppProxyMetadataFix.m
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppProxyMetadataFix.m
          git diff --cached --check
          git diff --cached
          git commit -m 'Try MobileIcons format 10 for missing app icons'
          git push origin HEAD:fix-ios27-app-icons-format10-20260813
