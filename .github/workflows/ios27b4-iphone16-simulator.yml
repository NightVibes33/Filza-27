name: iPhone 16 iOS 27 beta 4 simulator regression

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ByeTunes/**'
      - 'ByeTunesMetadataCompat.swift'
      - 'ByeTunesDownloadParityCompat.swift'
      - 'ByeTunesEmbeddedHost.swift'
      - 'Filza3105Host.swift'
      - 'FilzaMondCurrentHost.swift'
      - 'MondFullRootHost.swift'
      - 'scripts/patch-byetunes-*.sh'
      - 'scripts/restore-byetunes-v24-metadata-compat.sh'
      - 'scripts/run-ios27-simulator-regression.sh'
      - '.github/workflows/ios27b4-iphone16-simulator.yml'

concurrency:
  group: ios27b4-iphone16-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      IOS_RUNTIME_BUILD: 24A5390f
      SIM_NAME: Filza27-iPhone16-iOS27b4
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      MOND_COMMIT: 4a37bfca5cb4abb2c99891972365d872d700525e
      THREEONE_COMMIT: 438f3ccae6a436d0017185407bc286e55c357883

    steps:
      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run real component simulator regression
        run: bash scripts/run-ios27-simulator-regression.sh

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone16-iOS27b4-simulator-evidence
          path: |
            .sim/artifacts/**
            .sim/logs/**
            .sim/results/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
