name: iPhone 16 iOS 27 beta 4 simulator regression

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ByeTunes/**'
      - 'ByeTunesMetadataCompat.swift'
      - 'ByeTunesDownloadParityCompat.swift'
      - 'ByeTunesEmbeddedHost.swift'
      - 'Filza3105Host.swift'
      - 'FilzaMondCurrentHost.swift'
      - 'MondFullRootHost.swift'
      - 'scripts/build-idevice-simulator-ffi.sh'
      - 'scripts/patch-byetunes-*.sh'
      - 'scripts/restore-byetunes-v24-metadata-compat.sh'
      - 'scripts/run-ios27-simulator-regression.sh'
      - '.github/workflows/ios27b4-iphone16-simulator.yml'

concurrency:
  group: ios27b4-iphone16-simulator-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      IOS_RUNTIME_BUILD: 24A5390f
      SIM_NAME: Filza27-iPhone16-iOS27b4
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      MOND_COMMIT: 4a37bfca5cb4abb2c99891972365d872d700525e
      THREEONE_COMMIT: 438f3ccae6a436d0017185407bc286e55c357883

    steps:
      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build real idevice FFI for arm64 iOS Simulator
        run: |
          set -euxo pipefail
          bash scripts/build-idevice-simulator-ffi.sh

          # The build script stages the exact header/archive into the upstream
          # Xcode project. Also expose the same files in the reusable harness
          # layout so there is only one compiled FFI artifact in this run.
          mkdir -p Vendor/idevice-simulator/lib Vendor/idevice-simulator/include
          cp ByeTunes/MusicManager/libidevice_ffi.a Vendor/idevice-simulator/lib/libidevice_ffi.a
          cp ByeTunes/MusicManager/idevice.h Vendor/idevice-simulator/include/idevice.h
          cp ByeTunes/MusicManager/Bridging-Header.h Vendor/idevice-simulator/include/ByeTunesSimulatorBridging.h
          test -s Vendor/idevice-simulator/lib/libidevice_ffi.a
          test -s Vendor/idevice-simulator/include/idevice.h
          grep -Fq 'IdeviceFfiError' Vendor/idevice-simulator/include/idevice.h

      - name: Repair stale upstream ByeTunes Xcode settings for simulator
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          project = Path('ByeTunes/MusicManager.xcodeproj/project.pbxproj')
          text = project.read_text()

          old_host = '$(BUILT_PRODUCTS_DIR)/MusicManager.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MusicManager'
          new_host = '$(BUILT_PRODUCTS_DIR)/ByeTunes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ByeTunes'
          host_count = text.count(old_host)
          if host_count != 2:
              raise SystemExit(f'expected 2 stale TEST_HOST entries, found {host_count}')
          text = text.replace(old_host, new_host)

          bridge = 'SWIFT_OBJC_BRIDGING_HEADER = "MusicManager/Bridging-Header.h";'
          bridge_count = text.count(bridge)
          if bridge_count != 2:
              raise SystemExit(f'expected 2 bridging-header settings, found {bridge_count}')

          # The upstream project already searches $(PROJECT_DIR)/MusicManager.
          # Add the real Rust FFI archive to both app configurations.
          product_line = '\t\t\t\tPRODUCT_NAME = ByeTunes;\n'
          product_count = text.count(product_line)
          if product_count != 2:
              raise SystemExit(f'expected 2 ByeTunes PRODUCT_NAME settings, found {product_count}')
          text = text.replace(
              product_line,
              '\t\t\t\tOTHER_LDFLAGS = "-lidevice_ffi";\n' + product_line,
          )
          project.write_text(text)

          # Upstream renamed the app/module to ByeTunes but its unit test file
          # retained the old module import. Repair only that upstream test file;
          # the reusable harness already emits @testable import ByeTunes.
          path = Path('ByeTunes/MusicManagerTests/MusicManagerTests.swift')
          source = path.read_text()
          count = source.count('@testable import MusicManager')
          if count != 1:
              raise SystemExit(f'expected exactly one stale upstream test-module import, found {count}')
          path.write_text(source.replace('@testable import MusicManager', '@testable import ByeTunes'))
          PY

          grep -Fq 'TEST_HOST = "$(BUILT_PRODUCTS_DIR)/ByeTunes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ByeTunes";' ByeTunes/MusicManager.xcodeproj/project.pbxproj
          grep -Fq 'SWIFT_OBJC_BRIDGING_HEADER = "MusicManager/Bridging-Header.h";' ByeTunes/MusicManager.xcodeproj/project.pbxproj
          test -s ByeTunes/MusicManager/Bridging-Header.h
          test -s ByeTunes/MusicManager/idevice.h
          test -s ByeTunes/MusicManager/libidevice_ffi.a
          test "$(grep -Fc 'OTHER_LDFLAGS = "-lidevice_ffi";' ByeTunes/MusicManager.xcodeproj/project.pbxproj)" = 2
          grep -Fq '@testable import ByeTunes' ByeTunes/MusicManagerTests/MusicManagerTests.swift
          grep -Fq '@testable import ByeTunes' scripts/run-ios27-simulator-regression.sh

      - name: Run real component simulator regression
        run: bash scripts/run-ios27-simulator-regression.sh

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone16-iOS27b4-simulator-evidence
          path: |
            .sim/artifacts/**
            .sim/logs/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
