name: iPhone 16 iOS 27 beta 4 simulator regression

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ByeTunes/**'
      - 'ByeTunesMetadataCompat.swift'
      - 'ByeTunesDownloadParityCompat.swift'
      - 'ByeTunesEmbeddedHost.swift'
      - 'Filza3105Host.swift'
      - 'FilzaMondCurrentHost.swift'
      - 'MondFullRootHost.swift'
      - 'scripts/patch-byetunes-*.sh'
      - 'scripts/restore-byetunes-v24-metadata-compat.sh'
      - 'scripts/run-ios27-simulator-regression.sh'
      - '.github/workflows/ios27b4-iphone16-simulator.yml'

concurrency:
  group: ios27b4-iphone16-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      IOS_RUNTIME_BUILD: 24A5390f
      SIM_NAME: Filza27-iPhone16-iOS27b4
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      MOND_COMMIT: 4a37bfca5cb4abb2c99891972365d872d700525e
      THREEONE_COMMIT: 438f3ccae6a436d0017185407bc286e55c357883

    steps:
      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Repair stale upstream ByeTunes Xcode settings for simulator
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ByeTunes/MusicManager.xcodeproj/project.pbxproj')
          text = path.read_text()

          old_host = '$(BUILT_PRODUCTS_DIR)/MusicManager.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MusicManager'
          new_host = '$(BUILT_PRODUCTS_DIR)/ByeTunes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ByeTunes'
          host_count = text.count(old_host)
          if host_count != 2:
              raise SystemExit(f'expected 2 stale TEST_HOST entries, found {host_count}')
          text = text.replace(old_host, new_host)

          stale_bridge = '\t\t\t\tSWIFT_OBJC_BRIDGING_HEADER = "MusicManager/Bridging-Header.h";\n'
          bridge_count = text.count(stale_bridge)
          if bridge_count != 2:
              raise SystemExit(f'expected 2 stale bridging-header entries, found {bridge_count}')
          text = text.replace(stale_bridge, '')
          path.write_text(text)
          PY
          grep -Fq 'TEST_HOST = "$(BUILT_PRODUCTS_DIR)/ByeTunes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ByeTunes";' ByeTunes/MusicManager.xcodeproj/project.pbxproj
          ! grep -Fq 'TEST_HOST = "$(BUILT_PRODUCTS_DIR)/MusicManager.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MusicManager";' ByeTunes/MusicManager.xcodeproj/project.pbxproj
          ! grep -Fq 'SWIFT_OBJC_BRIDGING_HEADER = "MusicManager/Bridging-Header.h";' ByeTunes/MusicManager.xcodeproj/project.pbxproj
          test ! -e ByeTunes/MusicManager/Bridging-Header.h

      - name: Run real component simulator regression
        run: bash scripts/run-ios27-simulator-regression.sh

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone16-iOS27b4-simulator-evidence
          path: |
            .sim/artifacts/**
            .sim/logs/**
            .sim/results/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
