name: Repair Latest Filza Release

on:
  workflow_run:
    workflows: ["Verify ByeTunes All Sources + YouTube + SSH IPA"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-latest-filza-release.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-green-filza-27
  cancel-in-progress: false

jobs:
  repair-latest-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact successful verifier run
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          EVENT_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            test "$EVENT_RUN_CONCLUSION" = "success"
            test "$EVENT_RUN_BRANCH" = "main"
            RUN_ID="$EVENT_RUN_ID"
            RUN_NUMBER="$EVENT_RUN_NUMBER"
            VERIFIED_SHA="$EVENT_RUN_SHA"
          else
            RUN_JSON="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow verify-upstream-byetunes-ssh.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId,headSha,headBranch,number,status,conclusion)"
            RUN_ID="$(jq -r '.[0].databaseId // empty' <<<"$RUN_JSON")"
            RUN_NUMBER="$(jq -r '.[0].number // empty' <<<"$RUN_JSON")"
            VERIFIED_SHA="$(jq -r '.[0].headSha // empty' <<<"$RUN_JSON")"
            RUN_BRANCH="$(jq -r '.[0].headBranch // empty' <<<"$RUN_JSON")"
            RUN_STATUS="$(jq -r '.[0].status // empty' <<<"$RUN_JSON")"
            RUN_CONCLUSION="$(jq -r '.[0].conclusion // empty' <<<"$RUN_JSON")"
            test "$RUN_BRANCH" = "main"
            test "$RUN_STATUS" = "completed"
            test "$RUN_CONCLUSION" = "success"
          fi

          test -n "$RUN_ID"
          test -n "$RUN_NUMBER"
          test -n "$VERIFIED_SHA"
          test "$RUN_NUMBER" -gt 269

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing exact successful verifier run $RUN_ID (#$RUN_NUMBER), commit $VERIFIED_SHA"

      - name: Checkout exact green commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.verified.outputs.sha }}

      - name: Download exact green IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.verified.outputs.run_id }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf verified-modern release
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name Filza-27-modern-unsigned-arm64 \
            --dir verified-modern

      - name: Verify and stage release IPA
        env:
          RUN_NUMBER: ${{ steps.verified.outputs.run_number }}
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_IPA="$(find verified-modern -type f -name '*.ipa' -print -quit)"
          test -n "$SOURCE_IPA"
          test -s "$SOURCE_IPA"

          mkdir -p release
          cp "$SOURCE_IPA" release/Filza-27.ipa
          unzip -tq release/Filza-27.ipa
          unzip -l release/Filza-27.ipa | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          unzip -l release/Filza-27.ipa | grep -F 'MondEmbedded.bundle/Info.plist'
          unzip -l release/Filza-27.ipa | grep -F 'Filza3105.bundle/UpstreamAppInfo.plist'
          ! unzip -l release/Filza-27.ipa | grep -F 'Frameworks/FilzaMondModern.dylib'

          APP_PLIST="$(mktemp)"
          unzip -p release/Filza-27.ipa 'Payload/*.app/Info.plist' > "$APP_PLIST"
          python3 - "$APP_PLIST" "$RUN_NUMBER" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          if info.get("MinimumOSVersion") != "17.0":
              raise SystemExit(f"unexpected MinimumOSVersion: {info.get('MinimumOSVersion')!r}")
          if str(info.get("CFBundleVersion")) != sys.argv[2]:
              raise SystemExit(f"unexpected CFBundleVersion: {info.get('CFBundleVersion')!r}")
          if "CFBundleURLTypes" in info:
              raise SystemExit("CFBundleURLTypes unexpectedly present")
          PY
          rm -f "$APP_PLIST"

          sha256sum release/Filza-27.ipa | tee release/Filza-27-SHA256.txt

      - name: Publish versioned release and stable alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ steps.verified.outputs.run_number }}
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          set -euxo pipefail
          VERSIONED_TAG="filza-27-${RUN_NUMBER}"
          STABLE_TAG="filza-27-latest"
          NOTES="release/RELEASE_NOTES.md"
          cp RELEASE_NOTES.md "$NOTES"
          {
            printf '\n---\n\n### Verified build metadata\n\n'
            printf -- '- Modern verifier run: `%s`\n' "$RUN_NUMBER"
            printf -- '- Commit: `%s`\n' "$VERIFIED_SHA"
            printf -- '- Exact verifier artifact: `Filza-27-modern-unsigned-arm64`\n'
            printf -- '- Minimum iOS: `17.0`\n'
            printf -- '- Stable alias: `filza-27-latest`\n'
            printf -- '- Mond 2.2 + 3105 + ByeTunes + WebDAV + SSH/SFTP are included by the verifier contract.\n'
          } >> "$NOTES"

          resolve_tag_sha() {
            local tag="$1" ref_json object_type object_sha tag_json
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            for _ in 1 2 3 4; do
              [[ "$object_type" != "tag" ]] && break
              tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            done
            test "$object_type" = "commit"
            printf '%s' "$object_sha"
          }

          publish_release() {
            local tag="$1" title="$2"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [[ "$(resolve_tag_sha "$tag")" != "$VERIFIED_SHA" ]]; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                  -f sha="$VERIFIED_SHA" -F force=true >/dev/null
              fi
              gh release upload "$tag" release/Filza-27.ipa release/Filza-27-SHA256.txt \
                --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "$title" --notes-file "$NOTES" --latest
            else
              gh release create "$tag" release/Filza-27.ipa release/Filza-27-SHA256.txt \
                --repo "$GITHUB_REPOSITORY" --target "$VERIFIED_SHA" \
                --title "$title" --notes-file "$NOTES" --latest
            fi
            test "$(resolve_tag_sha "$tag")" = "$VERIFIED_SHA"
            local json
            json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            for asset in Filza-27.ipa Filza-27-SHA256.txt; do
              test "$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .name' <<<"$json")" = "$asset"
            done
          }

          publish_release "$VERSIONED_TAG" "Filza 27 — Modern iOS 17+ + Mond 2.2 (#${RUN_NUMBER})"
          publish_release "$STABLE_TAG" "Filza 27 — Latest Green Build (#${RUN_NUMBER})"

          LATEST_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          test "$(jq -r '.tag_name' <<<"$LATEST_JSON")" = "$STABLE_TAG"
          test "$(resolve_tag_sha "$STABLE_TAG")" = "$VERIFIED_SHA"
          echo "Published $VERSIONED_TAG and $STABLE_TAG at exact verified commit $VERIFIED_SHA"
