name: Repair Latest Filza Release

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/repair-latest-filza-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  repair-latest-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve newest green modern IPA run
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow verify-upstream-byetunes-ssh.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId,headSha,headBranch,number,status,conclusion)"

          RUN_ID="$(jq -r '.[0].databaseId // empty' <<<"$RUN_JSON")"
          RUN_NUMBER="$(jq -r '.[0].number // empty' <<<"$RUN_JSON")"
          VERIFIED_SHA="$(jq -r '.[0].headSha // empty' <<<"$RUN_JSON")"
          RUN_BRANCH="$(jq -r '.[0].headBranch // empty' <<<"$RUN_JSON")"
          RUN_STATUS="$(jq -r '.[0].status // empty' <<<"$RUN_JSON")"
          RUN_CONCLUSION="$(jq -r '.[0].conclusion // empty' <<<"$RUN_JSON")"

          test -n "$RUN_ID"
          test -n "$RUN_NUMBER"
          test -n "$VERIFIED_SHA"
          test "$RUN_BRANCH" = "main"
          test "$RUN_STATUS" = "completed"
          test "$RUN_CONCLUSION" = "success"

          # filza-27-269 is the stale release this repair is replacing.
          test "$RUN_NUMBER" -gt 269

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          echo "Repairing latest release from green run $RUN_ID (#$RUN_NUMBER), commit $VERIFIED_SHA"

      - name: Checkout exact green commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.verified.outputs.sha }}

      - name: Download exact green IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.verified.outputs.run_id }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf verified-modern release
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name Filza-27-modern-unsigned-arm64 \
            --dir verified-modern

      - name: Verify and stage release IPA
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_IPA="$(find verified-modern -type f -name '*.ipa' -print -quit)"
          test -n "$SOURCE_IPA"
          test -s "$SOURCE_IPA"
          mkdir -p release
          cp "$SOURCE_IPA" release/Filza-27.ipa
          unzip -tq release/Filza-27.ipa
          unzip -l release/Filza-27.ipa | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          unzip -l release/Filza-27.ipa | grep -F 'MondEmbedded.bundle/Info.plist'
          unzip -l release/Filza-27.ipa | grep -F 'Filza3105.bundle/UpstreamAppInfo.plist'
          ! unzip -l release/Filza-27.ipa | grep -F 'Frameworks/FilzaMondModern.dylib'

          APP_PLIST="$(mktemp)"
          unzip -p release/Filza-27.ipa 'Payload/*.app/Info.plist' > "$APP_PLIST"
          python3 - "$APP_PLIST" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          if info.get("MinimumOSVersion") != "17.0":
              raise SystemExit(f"unexpected MinimumOSVersion: {info.get('MinimumOSVersion')!r}")
          if "CFBundleURLTypes" in info:
              raise SystemExit("CFBundleURLTypes unexpectedly present")
          PY
          rm -f "$APP_PLIST"
          sha256sum release/Filza-27.ipa | tee release/Filza-27-SHA256.txt

      - name: Publish and force Latest to green Filza release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ steps.verified.outputs.run_number }}
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="filza-27-${RUN_NUMBER}"
          NOTES="release/RELEASE_NOTES.md"
          cp RELEASE_NOTES.md "$NOTES"
          {
            printf '\n---\n\n### Verified build metadata\n\n'
            printf -- '- Modern verifier run: `%s`\n' "$RUN_NUMBER"
            printf -- '- Commit: `%s`\n' "$VERIFIED_SHA"
            printf -- '- This release replaces stale `filza-27-269` as Latest.\n'
          } >> "$NOTES"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Filza-27.ipa release/Filza-27-SHA256.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Filza 27 — Modern iOS 17+ + Mond 2.2" \
              --notes-file "$NOTES" \
              --latest
          else
            gh release create "$TAG" release/Filza-27.ipa release/Filza-27-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$VERIFIED_SHA" \
              --title "Filza 27 — Modern iOS 17+ + Mond 2.2" \
              --notes-file "$NOTES" \
              --latest
          fi

          LATEST_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          test "$(jq -r '.tag_name' <<<"$LATEST_JSON")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$LATEST_JSON")" = "$VERIFIED_SHA"
          for asset in Filza-27.ipa Filza-27-SHA256.txt; do
            test "$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .name' <<<"$LATEST_JSON")" = "$asset"
          done
          echo "Latest is now $TAG at $VERIFIED_SHA"
