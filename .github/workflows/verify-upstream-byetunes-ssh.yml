name: Verify ByeTunes All Sources + YouTube + SSH IPA

# Every update to main must produce a fresh exact-SHA IPA artifact for release.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: verify-byetunes-all-youtube-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-ipa:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      WOLFSSH_COMMIT: e7c8dc2c2c54e5f0f2986be592e2243725a4dd33
      WOLFSSL_COMMIT: 9ab8a4b19debdade06b10d30cf70167de8f9b915
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      MOND_COMMIT: 3d91194716ad5f06afdf7e9037e6964e80a4ac29
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify modern source contracts
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.2"
          test "$(git -C ByeTunes rev-parse HEAD)" = "$BYETUNES_COMMIT"
          grep -Fq 'TARGET := iphone:clang:latest:17.0' Makefile
          grep -Fq 'include FilzaSSHMetadata.mk' Makefile
          grep -Fq 'include FilzaByeTunesNetwork.mk' Makefile
          grep -Fq "MOND_COMMIT=\"$MOND_COMMIT\"" scripts/stage-mond-22-overlay.sh
          grep -Fq 'stage-mond-22-overlay.sh' Makefile
          grep -Fq 'stage-3105-v1.sh' Makefile
          grep -Fq 'patch-3105-embedded-compat.sh' Makefile
          test -f FilzaWolfSSHServer.m
          test -f scripts/build-wolfssh-stack.sh
          test -f scripts/wolfssh-allow-multiple-session-channels.patch
          grep -Fq 'if (ssh->channelListSz >= 1)' scripts/wolfssh-allow-multiple-session-channels.patch
          grep -Fq 'wolfSSH_CTX_SetChannelOpenCb' FilzaWolfSSHServer.m
          grep -Fq 'wolfSSH rejected exec channel closed' FilzaWolfSSHServer.m
          grep -Fq 'wolfSSH_accept' FilzaWolfSSHServer.m
          grep -Fq 'wolfSSH_SFTP_read' FilzaWolfSSHServer.m
          grep -Fq 'silent-audio background keepalive active for wolfSSH' FilzaWolfSSHServer.m
          grep -Fq 'FilzaWolfSSHServer.m' FilzaSSHMetadata.mk
          ! grep -Fq 'FilzaSSHServerV2.m FilzaSSHPreferencesV2.m' FilzaSSHMetadata.mk
          test -f ByeTunesMetadataCompat.swift
          test -f ByeTunesDownloadParityCompat.swift
          test -f scripts/stage-byetunes-youtubekit.sh
          test -f scripts/verify-mond-source-completeness.sh
          test -f scripts/stage-mond-embedded-resources.sh
          test -f scripts/patch-mond-embedded-parity.sh
          ! test -e scripts/prepare-ios16-compat.sh
          ! test -e scripts/patch-mond-ios16-backport.sh
          ! test -d MondModern
          ! grep -Fq 'FilzaMondModern.dylib' FilzaMondBridge.m
          ! grep -Fq 'dlopen' FilzaMondBridge.m
          grep -Fq 'MondEmbeddedHostFactory' FilzaMondBridge.m
          grep -Fq 'FilzaEmbeddedPanel {' FilzaMondCurrentHost.swift
          ! grep -Fq 'ios16Backport' FilzaMondCurrentHost.swift

      - name: Restore pinned libssh verifier cache
        id: ssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/ssh
          key: ssh-stack-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}-${{ hashFiles('scripts/build-ssh-stack.sh') }}

      - name: Build pinned libssh verifier
        if: steps.ssh-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"

      - name: Restore pinned wolfSSH server cache
        id: wolfssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/wolfssh
          key: wolfssh-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios17-${{ env.WOLFSSH_COMMIT }}-${{ env.WOLFSSL_COMMIT }}-${{ hashFiles('scripts/build-wolfssh-stack.sh', 'scripts/wolfssh-allow-multiple-session-channels.patch') }}

      - name: Build pinned wolfSSH server stack
        if: steps.wolfssh-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-wolfssh-stack.sh "$GITHUB_WORKSPACE/Vendor/wolfssh"

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Build and verify modern arm64 target
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          test "$(cat Vendor/idevice/COMMIT)" = "$IDEVICE_COMMIT"
          test "$(cat Vendor/wolfssh/WOLFSSH_COMMIT)" = "$WOLFSSH_COMMIT"
          test "$(cat Vendor/wolfssh/WOLFSSL_COMMIT)" = "$WOLFSSL_COMMIT"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/ssh/lib/libssh.a
          test -s Vendor/wolfssh/lib/libwolfssh.a
          test -s Vendor/wolfssh/lib/libwolfssl.a
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:17.0

          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          grep -aFq 'MondEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'constructed pinned Mond 2.2 root at 3d91194716ad5f06afdf7e9037e6964e80a4ac29' "$DYLIB"
          grep -aFq 'Filza3105HostFactory' "$DYLIB"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'All Sources' "$DYLIB"
          grep -aFq 'YouTube' "$DYLIB"
          grep -aFq 'wolfSSH SSH/SFTP server listening address=' "$DYLIB"
          grep -aFq 'wolfSSH authenticated SFTP subsystem accepted' "$DYLIB"
          grep -aFq 'protocol self-test passed' "$DYLIB"
          grep -aFq 'jailed in-process WebDAV lifecycle hook installed' "$DYLIB"
          nm -gU "$DYLIB" > .theos/wolfssh-symbols.txt
          grep -Eq 'wolfSSH_accept|_wolfSSH_accept' .theos/wolfssh-symbols.txt
          ! otool -L "$DYLIB" | grep -Fq 'FilzaMondModern.dylib'
          bash scripts/verify-mond-source-completeness.sh

      - name: Generate runtime resources
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/generate-appintents-metadata.sh .theos/byetunes-appintents
          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources
          test -s .theos/byetunes-resources/AppIconImage.png
          test -s .theos/byetunes-resources/Config.plist
          test -s .theos/byetunes-resources/meriyah.umd.js
          test -s .theos/byetunes-resources/astring.umd.js
          test -s .theos/byetunes-resources/yt_ejs_helper.js
          test -s ThirdParty/mond-current/Resources/MondEmbedded.bundle/Info.plist
          test -s ThirdParty/3105/Resources/Filza3105.bundle/UpstreamAppInfo.plist

      - name: Download base Filza IPA
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 "$BASE_IPA_URL" -o .theos/FilzaSlop-base-unsigned.ipa
          echo "$BASE_IPA_SHA256  .theos/FilzaSlop-base-unsigned.ipa" | shasum -a 256 -c -

      - name: Package modern unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$(mktemp -d /tmp/filza-modern-ipa.XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          unzip -q .theos/FilzaSlop-base-unsigned.ipa -d "$STAGE"
          APP="$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Info.plist")"
          test -s "$APP/$EXECUTABLE"

          mkdir -p "$APP/Frameworks"
          cp .theos/obj/FilzaApplySandboxExt.dylib "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          rm -f "$APP/Frameworks/FilzaMondModern.dylib"
          codesign --remove-signature "$APP/Frameworks/FilzaApplySandboxExt.dylib" >/dev/null 2>&1 || true

          cp .theos/byetunes-resources/AppIconImage.png "$APP/AppIconImage.png"
          cp .theos/byetunes-resources/ByeTunes-Info.plist "$APP/ByeTunes-Info.plist"
          cp .theos/byetunes-resources/Config.plist "$APP/Config.plist"
          cp .theos/byetunes-resources/meriyah.umd.js "$APP/meriyah.umd.js"
          cp .theos/byetunes-resources/astring.umd.js "$APP/astring.umd.js"
          cp .theos/byetunes-resources/yt_ejs_helper.js "$APP/yt_ejs_helper.js"
          rm -rf "$APP/MondEmbedded.bundle" "$APP/Filza3105.bundle"
          cp -R ThirdParty/mond-current/Resources/MondEmbedded.bundle "$APP/MondEmbedded.bundle"
          cp -R ThirdParty/3105/Resources/Filza3105.bundle "$APP/Filza3105.bundle"
          if test -d .theos/byetunes-appintents/Metadata.appintents; then
            rm -rf "$APP/Metadata.appintents"
            cp -R .theos/byetunes-appintents/Metadata.appintents "$APP/Metadata.appintents"
          fi

          plutil -replace MinimumOSVersion -string "17.0" "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "$APP/Info.plist"
          plutil -replace UIFileSharingEnabled -bool YES "$APP/Info.plist"
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool YES "$APP/Info.plist"
          plutil -replace NSSupportsLiveActivities -bool YES "$APP/Info.plist"
          plutil -replace NSSupportsLiveActivitiesFrequentUpdates -bool YES "$APP/Info.plist"
          plutil -remove UIBackgroundModes "$APP/Info.plist" 2>/dev/null || true
          plutil -insert UIBackgroundModes -json '["audio"]' "$APP/Info.plist"
          plutil -replace NSLocalNetworkUsageDescription -string "Filza 27 uses your local network when you enable its WebDAV or SSH/SFTP server." "$APP/Info.plist"
          plutil -replace NSBonjourServices -json '["_http._tcp","_ssh._tcp"]' "$APP/Info.plist"
          bash scripts/merge-3105-app-metadata.sh "$APP/Info.plist"

          plutil -remove CFBundleURLTypes "$APP/Info.plist" 2>/dev/null || true
          if plutil -extract CFBundleURLTypes json -o - "$APP/Info.plist" >/dev/null 2>&1; then
            echo "CFBundleURLTypes was not stripped" >&2
            exit 70
          fi

          test "$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")" = "17.0"
          plutil -extract UIBackgroundModes json -o - "$APP/Info.plist" | grep -Fq '"audio"'
          test ! -e "$APP/Frameworks/FilzaMondModern.dylib"
          test -s "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          test -s "$APP/MondEmbedded.bundle/Info.plist"
          test -s "$APP/Filza3105.bundle/UpstreamAppInfo.plist"
          otool -L "$APP/$EXECUTABLE" | grep -F 'FilzaApplySandboxExt.dylib'

          OUTPUT="$GITHUB_WORKSPACE/.theos/Filza-27-modern-${GITHUB_SHA::7}-unsigned.ipa"
          rm -f "$OUTPUT"
          (cd "$STAGE" && zip -qry "$OUTPUT" Payload)
          test -s "$OUTPUT"
          unzip -tq "$OUTPUT"
          unzip -l "$OUTPUT" | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          ! unzip -l "$OUTPUT" | grep -F 'Frameworks/FilzaMondModern.dylib'
          shasum -a 256 "$OUTPUT" | tee .theos/IPA-SHA256.txt

      - name: Upload modern unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Filza-27-modern-unsigned-arm64
          path: |
            .theos/Filza-27-modern-*-unsigned.ipa
            .theos/IPA-SHA256.txt
            .theos/obj/FilzaApplySandboxExt.dylib
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
