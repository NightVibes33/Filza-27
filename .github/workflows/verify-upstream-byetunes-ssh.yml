name: Verify ByeTunes All Sources + YouTube + SSH IPA

# Every update to main must produce a fresh exact-SHA IPA artifact for release.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: verify-byetunes-all-youtube-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-ipa:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BYETUNES_COMMIT: 8a4be32f188f30b98f15b00566c5ff3edc1c03b1
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      MOND_COMMIT: 3d91194716ad5f06afdf7e9037e6964e80a4ac29
      BASE_IPA_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223
      BASE_IPA_URL: https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.2/FilzaSlop-v1.0.2-unsigned.ipa

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify modern source contracts
        shell: bash
        run: |
          set -euxo pipefail
          test "$(grep -E '^TARGET *:=' Makefile | head -1)" = 'TARGET := iphone:clang:latest:17.0'
          ! grep -q 'FilzaMondModern' Makefile
          ! grep -q 'prepare-ios16-compat' Makefile
          ! grep -q 'FilzaMondModern' scripts/build_release_ipa.sh
          ! grep -q 'FilzaMondModern' FilzaMondBridge.m
          grep -q 'MondEmbeddedHostFactory' FilzaMondBridge.m
          grep -q 'MinimumOSVersion' scripts/build_release_ipa.sh
          grep -q '17.0' scripts/build_release_ipa.sh
          grep -q 'CFBundleURLTypes' scripts/build_release_ipa.sh
          grep -q 'MondEmbeddedHostFactory' FilzaMondBridge.m
          grep -q 'Filza3105EmbeddedHostFactory' Filza3105Bridge.m
          grep -q 'ByeTunesEmbeddedHostFactory' ByeTunesFullAppLauncher.m
          grep -q 'FilzaSSHServerStart' FilzaSSHServer.m
          grep -q 'GCDWebDAVServer' WebDAVRuntimeV2.m

      - name: Restore pinned SSH stack cache
        id: ssh-cache
        uses: actions/cache@v4
        with:
          path: .deps/ssh-prefix
          key: ssh-stack-${{ runner.os }}-${{ runner.arch }}-ios17-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}

      - name: Build pinned SSH stack
        if: steps.ssh-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ssh-stack.sh

      - name: Install Procursus build tools
        run: |
          brew install ldid xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: .deps/idevice-prefix
          key: idevice-${{ runner.os }}-${{ runner.arch }}-ios17-${{ env.IDEVICE_COMMIT }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-idevice.sh

      - name: Build and verify modern arm64 target
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make package FINALPACKAGE=1
          DYLIB=.theos/obj/arm64/FilzaApplySandboxExt.dylib
          test -f "$DYLIB"
          xcrun vtool -show-build "$DYLIB" | tee /tmp/vtool.txt
          grep -q 'minos 17.0' /tmp/vtool.txt
          nm -gU "$DYLIB" | grep -q '_MondEmbeddedHostFactory'
          nm -gU "$DYLIB" | grep -q '_Filza3105EmbeddedHostFactory'
          nm -gU "$DYLIB" | grep -q '_FilzaSSHServerStart'
          nm -gU "$DYLIB" | grep -q '_ByeTunesEmbeddedHostFactory'

      - name: Generate runtime resources
        run: |
          ./scripts/stage-byetunes-resources.sh
          ./scripts/stage-mond-embedded-resources.sh

      - name: Download base Filza IPA
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 -o /tmp/base.ipa "$BASE_IPA_URL"
          echo "$BASE_IPA_SHA256  /tmp/base.ipa" | shasum -a 256 -c -

      - name: Package modern unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/build_release_ipa.sh /tmp/base.ipa /tmp/Filza-27.ipa
          test -s /tmp/Filza-27.ipa
          rm -rf /tmp/filza-verify
          mkdir /tmp/filza-verify
          unzip -q /tmp/Filza-27.ipa -d /tmp/filza-verify
          APP="$(find /tmp/filza-verify/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test ! -e "$APP/Frameworks/FilzaMondModern.dylib"
          test -e "$APP/Frameworks/FilzaApplySandboxExt.dylib"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '17.0'
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$APP/Info.plist" >/dev/null 2>&1; then
            echo 'CFBundleURLTypes unexpectedly present in packaged IPA' >&2
            exit 1
          fi
          shasum -a 256 /tmp/Filza-27.ipa > /tmp/Filza-27-SHA256.txt

      - name: Upload modern unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Filza-27-modern-unsigned-arm64
          path: |
            /tmp/Filza-27.ipa
            /tmp/Filza-27-SHA256.txt
          if-no-files-found: error
          include-hidden-files: true
