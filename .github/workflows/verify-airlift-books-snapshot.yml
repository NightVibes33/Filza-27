name: Verify Airlift Books Snapshot
on:
  workflow_dispatch:
  push:
    branches: [experiment/airlift-filza27]
jobs:
  source-gates:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply experiment integration
        run: bash scripts/apply-airlift-experiment.sh
      - name: Verify integration gates
        run: |
          grep -q 'BooksPreimageStable' AirliftCanaryExploit.m
          grep -q 'BooksRestoreVerified' AirliftCanaryExploit.m
          grep -q 'AirliftBooksState.m' Makefile
          grep -q 'AirliftCanaryExploit.m' Makefile
          grep -q 'FZACSnapshotBooksState' AirliftBooksState.m
          grep -q 'FZACRestoreBooksState' AirliftBooksState.m
