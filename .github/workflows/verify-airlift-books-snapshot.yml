name: Verify Airlift Books Snapshot
on:
  workflow_dispatch:
  push:
    branches: [experiment/airlift-filza27]
jobs:
  source-gates:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply guarded integration and validate source
        run: |
          bash scripts/patch-airlift-books-snapshot.sh
          grep -q 'BooksPreimageStable' AirliftCanaryExploit.m
          grep -q 'BooksRestoreVerified' AirliftCanaryExploit.m
          grep -q 'FZACSnapshotBooksState' AirliftBooksState.m
          grep -q 'FZACRestoreBooksState' AirliftBooksState.m
          xcrun clang -fsyntax-only -fobjc-arc -x objective-c -I Vendor/idevice/include -I . -framework Foundation AirliftBooksState.m
