name: Verify iOS 16 + Universal Support

on:
  push:
    branches: [ main, mond-ios16-full ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: verify-universal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-ios16-core:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore pinned SSH stack cache
        id: ssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/ssh
          key: ios16-ssh-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}-${{ hashFiles('scripts/build-ssh-stack.sh') }}

      - name: Build pinned SSH stack
        if: steps.ssh-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: ios16-theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: ios16-idevice-${{ runner.os }}-${{ runner.arch }}-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Prepare universal iOS 16 core graph
        run: |
          set -euxo pipefail
          bash scripts/prepare-ios16-compat.sh
          grep -Fq 'Filza3105Host.swift' Makefile
          grep -Fq '$(BYETUNES_SWIFT_FILES)' Makefile
          ! grep '^FilzaApplySandboxExt_SWIFT_FILES' Makefile | grep -Fq 'FilzaMondCurrentHost.swift'
          ! grep '^FilzaApplySandboxExt_SWIFT_FILES' Makefile | grep -Fq '$(MOND_SWIFT_FILES)'
          grep -Fq 'FilzaMondPresentFromController(controller);' FilzaMainToolbarGestalt.m
          grep -Fq 'FilzaMondPresentFromController(source);' FilzaQuickActions.m
          grep -Fq 'FilzaMondModern.dylib' FilzaMondBridge.m

      - name: Build and verify iOS 16.1 core
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:16.1
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          ! grep -aFq 'MondEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'FilzaMondModern.dylib' "$DYLIB"
          grep -aFq 'Filza3105HostFactory' "$DYLIB"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          ! otool -L "$DYLIB" | grep -Fq 'FilzaMondModern.dylib'
          python3 - "$DYLIB" <<'PY'
          import re, subprocess, sys
          out = subprocess.check_output(["otool", "-l", sys.argv[1]], text=True)
          m = re.search(r"cmd LC_BUILD_VERSION.*?\n\s*cmdsize .*?\n\s*platform .*?\n\s*minos ([0-9.]+)", out, re.S)
          if not m or m.group(1) != "16.1":
              raise SystemExit(f"unexpected core deployment target: {m.group(1) if m else 'missing'}")
          PY
          shasum -a 256 "$DYLIB"

      - name: Upload verified iOS 16 core
        uses: actions/upload-artifact@v4
        with:
          name: Filza-27-ios16-core-arm64
          path: .theos/obj/FilzaApplySandboxExt.dylib
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  arm64-full-mond22:
    runs-on: macos-26-intel
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MOND_COMMIT: 3d91194716ad5f06afdf7e9037e6964e80a4ac29
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Mond 2.2 integration contract
        run: |
          set -euxo pipefail
          grep -Fq "MOND_COMMIT=\"$MOND_COMMIT\"" scripts/stage-mond-22-overlay.sh
          grep -Fq 'full Mond 2.2 route installed commit=3d91194716ad5f06afdf7e9037e6964e80a4ac29' FilzaMondBridge.m
          grep -Fq 'iOS 16 compatibility mode active' FilzaMondCurrentHost.swift
          grep -Fq 'patch-mond-ios16-backport.sh' MondModern/Makefile

      - name: Restore pinned SSH stack cache
        id: ssh-cache-full
        uses: actions/cache@v4
        with:
          path: Vendor/ssh
          key: full-ssh-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}-${{ hashFiles('scripts/build-ssh-stack.sh') }}

      - name: Build pinned SSH stack
        if: steps.ssh-cache-full.outputs.cache-hit != 'true'
        run: bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Restore pinned Theos cache
        id: theos-cache-full
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: full-theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache-full.outputs.cache-hit != 'true'
        run: |
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Restore pinned idevice FFI cache
        id: idevice-cache-full
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: full-idevice-${{ runner.os }}-${{ runner.arch }}-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache-full.outputs.cache-hit != 'true'
        run: bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Stage and verify exact Mond 2.2 source graph
        run: |
          set -euxo pipefail
          bash scripts/stage-mond-current.sh
          bash scripts/stage-mond-22-overlay.sh
          bash scripts/verify-mond-source-completeness.sh
          bash scripts/stage-mond-embedded-resources.sh
          test -s ThirdParty/mond-current/Generated/Mond/views_tweaks_GestaltView.swift
          test -s ThirdParty/mond-current/Generated/Mond/views_tweaks_posterboard_TendiesView.swift

      - name: Build full arm64 target with Mond 2.2
        run: |
          set -euxo pipefail
          export PATH="/opt/procursus/bin:$PATH"
          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1
          DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -s "$DYLIB"
          test "$(lipo -archs "$DYLIB")" = "arm64"
          grep -aFq 'MondEmbeddedHostFactory' "$DYLIB"
          grep -aFq 'CacheExtra Fields' "$DYLIB"
          grep -aFq 'Filza3105HostFactory' "$DYLIB"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$DYLIB"
          shasum -a 256 "$DYLIB"

      - name: Upload full build
        uses: actions/upload-artifact@v4
        with:
          name: Filza-27-arm64-full-mond22
          path: .theos/obj/FilzaApplySandboxExt.dylib
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
